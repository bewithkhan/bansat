# Utah (United States). Summarised in Bansat's own words from the official sources linked below.
# Not legal advice: check the sources before relying on any fact.
id: us-ut
name: Utah
tier: full
applies_with: [us-federal]
laws:
  - name: Utah Consumer Privacy Act (UCPA)
    citation: Utah Code Title 13, Chapter 61
    official_url: https://le.utah.gov/xcode/Title13/Chapter61/C13-61_2022050420231231.html
    status: in-force
    in_force_from: "2023-12-31"
    notes: A right to correct was added from 1 July 2026. A new Part 5 on motor vehicle data starts on 1 January 2027.
  - name: Protection of Personal Information Act
    citation: Utah Code Title 13, Chapter 44
    official_url: https://le.utah.gov/xcode/Title13/Chapter44/C13-44_1800010118000101.html
    status: in-force
    in_force_from: "2007-01-01"
    notes: Data security and breach notification. In force from 1 January 2007 under § 7 of 2006 S.B. 69 (Laws of Utah 2006, ch. 343), which enacted it as chapter 13-42; it is now chapter 13-44.
  - name: Utah Commercial Email Act
    citation: Utah Code Title 13, Chapter 65
    official_url: https://le.utah.gov/xcode/Title13/Chapter65/C13-65_2023050320230503.html
    status: in-force
    in_force_from: "2023-05-03"
  - name: Generative Artificial Intelligence, Consumer Disclosures and Enforcement
    citation: Utah Code Title 13, Chapter 77
    official_url: https://le.utah.gov/xcode/Title13/Chapter77/C13-77_2025050820250508.html
    status: in-force
    in_force_from: "2025-05-07"
  - name: Artificial Intelligence Policy Act
    citation: Utah Code Title 13, Chapter 72
    official_url: https://le.utah.gov/xcode/Title13/Chapter72/C13-72_2024050120240501.html
    status: in-force
    in_force_from: "2024-05-01"
    notes: Creates the Office of Artificial Intelligence Policy, a learning laboratory and regulatory mitigation agreements. Scheduled for repeal on 1 July 2027 (Utah Code 63I-2-213).
  - name: Artificial Intelligence Applications Relating to Mental Health
    citation: Utah Code Title 13, Chapter 72a
    official_url: https://le.utah.gov/xcode/Title13/Chapter72a/C13-72a_2025050720250507.html
    status: in-force
    in_force_from: "2025-05-07"
    notes: Suppliers of mental health chatbots can't sell or share Utah users' health information or inputs (with narrow exceptions), must label ads and can't use inputs to target them, and must say the chatbot is AI before use, after 7 days without use and when asked. Fines are up to $2,500 per violation.
  - name: Digital Voyeurism Prevention Act
    citation: Utah Code Title 13, Chapter 72b
    official_url: https://le.utah.gov/xcode/Title13/Chapter72b/C13-72b_2026050620270101.html
    status: enacted
    in_force_from: "2027-01-01"
    notes: Enacted by Laws of Utah 2026, ch. 352. AI image services can't distribute fake intimate images of an identifiable person without verified consent kept on record for 7 years, and people harmed can sue; a safe harbour protects services with published policies and safeguards. Covered platforms must remove reported images within 48 hours.
  - name: Digital Content Provenance Standards Act
    citation: Utah Code Title 13, Chapter 72c
    official_url: https://le.utah.gov/xcode/Title13/Chapter72c/C13-72c_2026050620270101.html
    status: enacted
    in_force_from: "2027-01-01"
    notes: Generative AI providers with over 1 million monthly users must embed provenance disclosures in AI images, video and audio. Large online platforms (over 2 million monthly users) must detect and show provenance data and not strip it, and capture devices sold from 1 January 2028 must embed it. Fines are up to $2,500 per violation.
  - name: App Store Accountability Act
    citation: Utah Code Title 13, Chapter 76
    official_url: https://le.utah.gov/xcode/Title13/Chapter76/C13-76_2025050720250507.html
    status: in-force
    in_force_from: "2025-05-07"
    notes: After 2026 amendments, the developer duties and private lawsuits start on 6 May 2027. Only harmed minors or their parents can sue, for actual damages or $1,000 per violation, whichever is greater, and developers that rely in good faith on app store data have a safe harbour.
  - name: Utah Digital Choice Act
    citation: Utah Code Title 13, Chapter 81
    official_url: https://le.utah.gov/xcode/Title13/Chapter81/C13-81_2026070120250507.html
    status: in-force
    in_force_from: "2026-07-01"
    notes: Data portability and interoperability for social media services.
  - name: Utah Minor Protection in Social Media Act
    citation: Utah Code Title 13, Chapter 71
    official_url: https://le.utah.gov/xcode/Title13/Chapter71/C13-71_2024100120240501.html
    status: in-force
    in_force_from: "2024-10-01"
    notes: A federal court has barred enforcement of any part of it since 10 September 2024, and the appeal is pending (see children).
regulators:
  - name: Utah Division of Consumer Protection
    url: https://dcp.utah.gov/
  - name: Office of the Utah Attorney General
    url: https://attorneygeneral.utah.gov/
obligations:
  scope:
    summary: Applies to businesses that operate in Utah or target its residents, have annual revenue of $25 million or more, and either process data of 100,000 or more consumers a year or get over half their revenue from selling data of 25,000 or more. Government, tribes, universities, non-profits, HIPAA covered entities and GLBA financial institutions are exempt. Employees and B2B contacts aren't consumers. From 1 January 2027 it also covers car makers that collect data through vehicles.
    source:
      - https://le.utah.gov/xcode/Title13/Chapter61/C13-61-S102_2024050120240501.html
      - https://le.utah.gov/xcode/Title13/Chapter61/C13-61-S102_2026050620270101.html
      - https://le.utah.gov/xcode/Title13/Chapter61/C13-61-S101_2026050620260506.html
  lawful_bases:
    summary: There are no GDPR-style lawful bases. Controllers give a privacy notice and honour rights to access, delete data the consumer provided, port data, correct it (since 1 July 2026), and opt out of targeted advertising and sale. There's no profiling opt-out. Sensitive data needs clear notice and a chance to opt out, rather than opt-in consent; a known child's data follows COPPA.
    source:
      - https://le.utah.gov/xcode/Title13/Chapter61/C13-61-S201_2026070120250507.html
      - https://le.utah.gov/xcode/Title13/Chapter61/C13-61-S302_2022050420231231.html
  consent_age:
    summary: A child is under 13, and a known child's data must be processed under COPPA, with verifiable parental consent. The UCPA has no teen opt-in rule for targeted advertising or sale.
    value: 13
    unit: years
    source:
      - https://le.utah.gov/xcode/Title13/Chapter61/C13-61-S101_2026050620260506.html
      - https://le.utah.gov/xcode/Title13/Chapter61/C13-61-S302_2022050420231231.html
  children:
    summary: The Minor Protection in Social Media Act requires age assurance and maximum-privacy defaults for minors' accounts, but in September 2024 a federal court barred Utah from enforcing any part of it. The appeal (10th Cir. No. 24-4100) was argued on 20 November 2025, with no decision as of 5 November 2026. From 6 May 2027, the App Store Accountability Act requires app developers to check app store age categories and parental consent, use them only for safety and compliance, and not enforce terms against minors without that consent; harmed minors or parents can sue.
    source:
      - https://le.utah.gov/xcode/Title13/Chapter71/C13-71-S202_2024100120240501.html
      - https://www.govinfo.gov/content/pkg/USCOURTS-utd-2_23-cv-00911/pdf/USCOURTS-utd-2_23-cv-00911-1.pdf
      - https://www.ca10.uscourts.gov/oralargument/search-results?combine=24-4100
      - https://www.ca10.uscourts.gov/opinion/search?combine=24-4100
      - https://le.utah.gov/xcode/Title13/Chapter76/C13-76-S202_2026031820260318.html
      - https://le.utah.gov/xcode/Title13/Chapter76/C13-76-S401_2026031820260318.html
  cookies:
    summary: There's no cookie-consent rule. Consumers can opt out of targeted advertising and sale, and a controller that does either must clearly explain how. The UCPA doesn't require honouring a universal opt-out signal such as Global Privacy Control.
    source:
      - https://le.utah.gov/xcode/Title13/Chapter61/C13-61-S302_2022050420231231.html
      - https://le.utah.gov/xcode/Title13/Chapter61/C13-61-S201_2026070120250507.html
  marketing:
    summary: On top of CAN-SPAM and the TCPA, Utah's Commercial Email Act bars commercial email sent from or to Utah that misuses a third party's domain, forges headers or has a misleading subject line; providers and recipients can sue for $1,000 per email ($100 with due diligence). Autodialed sales calls need consent or an existing relationship, calls to Utah numbers on the national Do Not Call Registry are banned, and calls from 9pm to 8am, on Sundays or on holidays need consent, with private suits for at least $500. Unless exempt, telemarketing sellers must register yearly and post a bond.
    source:
      - https://le.utah.gov/xcode/Title13/Chapter65/C13-65-S201_2024050120240501.html
      - https://le.utah.gov/xcode/Title13/Chapter65/C13-65-S202_2023050320230503.html
      - https://le.utah.gov/xcode/Title13/Chapter25a/C13-25a-S103_2022050420220504.html
      - https://le.utah.gov/xcode/Title13/Chapter25a/C13-25a-S107_2021050520210505.html
      - https://le.utah.gov/xcode/Title13/Chapter25a/C13-25a-S108_2020051220200512.html
      - https://le.utah.gov/xcode/Title13/Chapter26/C13-26-S102_2026050620260506.html
  breach_notice:
    summary: After a breach, investigate promptly. If misuse for identity theft or fraud has happened or is likely, notify affected Utah residents in the most expedient time possible without unreasonable delay. If 500 or more residents are affected, also notify the Attorney General and the Utah Cyber Center, and the nationwide credit bureaus if 1,000 or more. Fines are up to $2,500 per consumer and $100,000 in total in most cases.
    source:
      - https://le.utah.gov/xcode/Title13/Chapter44/C13-44-S202_2024050120240501.html
      - https://le.utah.gov/xcode/Title13/Chapter44/C13-44-S301_2025050720250507.html
      - https://le.utah.gov/~2006/bills/sbillenr/SB0069.pdf
  registration_or_fees:
    summary: The UCPA requires no registration or fee.
    source:
      - https://le.utah.gov/xcode/Title13/Chapter61/C13-61_2022050420231231.html
  dpo:
    summary: There's no requirement to appoint a data protection officer.
    source:
      - https://le.utah.gov/xcode/Title13/Chapter61/C13-61_2022050420231231.html
  transfers:
    summary: Utah law sets no restrictions on transferring personal data abroad; federal rules are in us-federal.
    source:
      - https://le.utah.gov/xcode/Title13/Chapter61/C13-61_2022050420231231.html
  dpia:
    summary: The UCPA doesn't require data protection assessments.
    source:
      - https://le.utah.gov/xcode/Title13/Chapter61/C13-61_2022050420231231.html
  automated_decisions_ai:
    summary: The UCPA has no right to opt out of profiling. If a consumer clearly asks, a business using generative AI must say they're talking to AI, and licensed professionals must disclose it upfront in high-risk interactions (clear disclosure throughout is a safe harbour); fines are up to $2,500 per violation. Since 7 May 2025, mental health chatbots must disclose they're AI and protect users' health data and inputs. From 1 January 2027, AI image services need consent for intimate images and large generative AI providers must embed provenance data. The AI Policy Act is repealed on 1 July 2027.
    source:
      - https://le.utah.gov/xcode/Title13/Chapter77/C13-77-S103_2025050720250507.html
      - https://le.utah.gov/xcode/Title13/Chapter77/C13-77-S104_2025050720250507.html
      - https://le.utah.gov/xcode/Title13/Chapter77/C13-77-S105_2025050720250507.html
      - https://le.utah.gov/xcode/Title13/Chapter72a/C13-72a-S201_2025050720250507.html
      - https://le.utah.gov/xcode/Title13/Chapter72a/C13-72a-S203_2025050720250507.html
      - https://le.utah.gov/xcode/Title13/Chapter72b/C13-72b-S201_2026050620270101.html
      - https://le.utah.gov/xcode/Title13/Chapter72c/C13-72c-S203_2026050620270101.html
      - https://le.utah.gov/xcode/Title13/Chapter72/C13-72-S201_2026050620260506.html
  penalties:
    summary: The Division of Consumer Protection takes complaints and refers cases, and the Attorney General enforces alone. Before suing, the Attorney General must give 30 days' notice to cure, and this right to cure doesn't expire. Penalties are up to $7,500 per violation plus actual damages to consumers. There's no private right of action.
    source:
      - https://le.utah.gov/xcode/Title13/Chapter61/C13-61-S402_2022050420231231.html
      - https://le.utah.gov/xcode/Title13/Chapter61/C13-61-S305_2022050420231231.html
