# United States (federal rules). Summarised in Bansat's own words from the official sources linked below.
# Not legal advice: check the sources before relying on any fact. State entries (us-xx) apply with this one.
id: us-federal
name: United States (federal)
tier: full
laws:
  - name: Federal Trade Commission Act, section 5
    citation: 15 U.S.C. 45
    official_url: https://www.govinfo.gov/content/pkg/USCODE-2024-title15/html/USCODE-2024-title15-chap2-subchapI-sec45.htm
    status: in-force
    in_force_from: "1914-09-26"
    notes: Bans unfair or deceptive acts or practices, the FTC's main power over privacy and data security. The wording on unfair or deceptive practices dates from a 1938 amendment.
  - name: Children's Online Privacy Protection Act (COPPA) and COPPA Rule
    citation: 15 U.S.C. 6501–6506; 16 CFR Part 312, as amended at 90 FR 16918 (22 April 2025)
    official_url: https://www.ecfr.gov/current/title-16/chapter-I/subchapter-C/part-312
    status: in-force
    in_force_from: "2000-04-21"
    notes: The amended Rule took effect on 23 June 2025, and most of its changes had to be complied with by 22 April 2026.
  - name: CAN-SPAM Act of 2003
    citation: 15 U.S.C. 7701–7713; 16 CFR Part 316
    official_url: https://www.govinfo.gov/content/pkg/USCODE-2024-title15/html/USCODE-2024-title15-chap103-sec7704.htm
    status: in-force
    in_force_from: "2004-01-01"
    notes: Rules for commercial email.
  - name: Telephone Consumer Protection Act (TCPA)
    citation: 47 U.S.C. 227; 47 CFR 64.1200
    official_url: https://www.govinfo.gov/content/pkg/USCODE-2024-title47/html/USCODE-2024-title47-chap5-subchapII-partI-sec227.htm
    status: in-force
    in_force_from: "1992-12-20"
    notes: Rules for marketing calls and texts, enforced by the FCC, state attorneys general and private lawsuits.
  - name: HIPAA Privacy, Security and Breach Notification Rules
    citation: Pub. L. 104-191, as amended by the HITECH Act; 45 CFR Parts 160 and 164
    official_url: https://www.hhs.gov/hipaa/for-professionals/privacy/laws-regulations/index.html
    status: in-force
    in_force_from: "2003-04-14"
    notes: Applies only to health plans, health care clearinghouses, providers that carry out standard electronic transactions, and their business associates. A proposal to tighten the Security Rule, issued in December 2024, is still pending.
  - name: Gramm-Leach-Bliley Act (GLBA), Title V
    citation: 15 U.S.C. 6801–6809; Regulation P (12 CFR Part 1016); FTC Safeguards Rule (16 CFR Part 314)
    official_url: https://www.govinfo.gov/content/pkg/USCODE-2024-title15/html/USCODE-2024-title15-chap94-subchapI-sec6802.htm
    status: in-force
    in_force_from: "2000-11-13"
    notes: Applies to financial institutions, defined by their activities, including many non-bank lenders, brokers and tax preparers. The privacy rules took effect on 13 November 2000, with full compliance required from 1 July 2001.
  - name: Protecting Americans' Data from Foreign Adversaries Act of 2024
    citation: Pub. L. 118-50, div. I; 15 U.S.C. 9901
    official_url: https://www.govinfo.gov/content/pkg/USCODE-2024-title15/html/USCODE-2024-title15-chap123-sec9901.htm
    status: in-force
    in_force_from: "2024-06-23"
  - name: DOJ Data Security Program (bulk sensitive data rule)
    citation: 28 CFR Part 202 (90 FR 1636, 8 January 2025), under Executive Order 14117
    official_url: https://www.justice.gov/nsd/data-security
    status: in-force
    in_force_from: "2025-04-08"
    notes: Due diligence, audit and reporting duties apply from 6 October 2025.
  - name: TAKE IT DOWN Act
    citation: Pub. L. 119-12
    official_url: https://www.govinfo.gov/content/pkg/PLAW-119publ12/html/PLAW-119publ12.htm
    status: in-force
    in_force_from: "2025-05-19"
    notes: Platforms hosting user content had until 19 May 2026 to set up a notice-and-removal process for non-consensual intimate images, including AI-generated ones.
  - name: Children and Teens' Online Privacy Protection Act (COPPA 2.0)
    citation: S. 836, 119th Congress
    official_url: https://www.govinfo.gov/content/pkg/BILLS-119s836es/html/BILLS-119s836es.htm
    status: draft
    notes: Passed the Senate on 5 March 2026 and awaits House action. It would extend COPPA's protections to teens aged 13 to 16. Not law.
