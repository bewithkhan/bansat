# New Jersey. Summarised in Bansat's own words from the official sources linked below.
# Not legal advice: check the sources before relying on any fact.
id: us-nj
name: New Jersey
tier: full
applies_with: [us-federal]
laws:
  - name: New Jersey Data Privacy Act
    citation: P.L.2023, c.266; N.J.S.A. 56:8-166.4 to 56:8-166.19
    official_url: https://pub.njleg.state.nj.us/Bills/2022/PL23/266_.PDF
    status: in-force
    in_force_from: "2025-01-15"
    notes: Amended by P.L.2025, c.367 (approved 20 January 2026), which widened de-identified data and the exemptions, and by P.L.2026, c.25 (approved 30 June 2026), which bans selling sensitive data.
  - name: Data brokers and sensitive data Act
    citation: P.L.2026, c.25; N.J.S.A. 56:8-166.20 to 56:8-166.24
    official_url: https://pub.njleg.state.nj.us/Bills/2026/PL26/25_.PDF
    status: in-force
    in_force_from: "2026-06-30"
    notes: Took effect on approval, except that the Division's public registry of data brokers starts 270 days later.
  - name: Identity Theft Prevention Act (security breach notice)
    citation: P.L.2005, c.226; N.J.S.A. 56:8-161 to 56:8-166
    official_url: https://lis.njleg.state.nj.us/nxt/gateway.dll/statutes/1/54260/54661
    status: in-force
    in_force_from: "2006-01-01"
regulators:
  - name: New Jersey Office of the Attorney General, Division of Consumer Affairs
    url: https://www.njoag.gov/
obligations:
  scope:
    summary: Applies to controllers doing business in New Jersey or targeting its residents that in a calendar year control or process data of 100,000+ consumers (excluding payment-only data), or 25,000+ while earning any revenue or discount from selling data. Non-profits are covered. GLBA financial institutions, insurers and HIPAA-protected health data are exempt. Employees and B2B contacts aren't consumers. The 2026 ban on selling sensitive data applies to everyone, whatever their size.
    source:
      - https://lis.njleg.state.nj.us/nxt/gateway.dll/statutes/1/54260/54668
      - https://lis.njleg.state.nj.us/nxt/gateway.dll/statutes/1/54260/54676
      - https://lis.njleg.state.nj.us/nxt/gateway.dll/statutes/1/54260/54675
  lawful_bases:
    summary: No GDPR-style lawful bases. Controllers give a privacy notice and honour rights to access, correct, delete and port data and to opt out of targeted advertising, sale and profiling for significant decisions, within 45 days (extendable by 45). Sensitive data needs opt-in consent, and since 30 June 2026 it may not be sold at all. The law tells the Division of Consumer Affairs to adopt rules; check its site for the current rules.
    source:
      - https://pub.njleg.state.nj.us/Bills/2022/PL23/266_.PDF
      - https://lis.njleg.state.nj.us/nxt/gateway.dll/statutes/1/54260/54675
      - https://lis.njleg.state.nj.us/nxt/gateway.dll/statutes/1/54260/54681
  consent_age:
    summary: A child is under 13 (as in COPPA), and a known child's data must be processed as COPPA requires. Teens aged 13 to 16 must consent before their data is used for targeted advertising, sold, or used for profiling with significant effects, if the controller knows or wilfully disregards their age.
    value: 13
    unit: years
    source:
      - https://lis.njleg.state.nj.us/nxt/gateway.dll/statutes/1/54260/54675
      - https://lis.njleg.state.nj.us/nxt/gateway.dll/statutes/1/54260/54667
  children:
    summary: Data collected from a known child is sensitive data, so it may not be sold. Data brokers registering with the Division must describe how they handle data of under-18s and whether they know they hold it. We found no separate New Jersey children's privacy or age-appropriate design law in force.
    source:
      - https://lis.njleg.state.nj.us/nxt/gateway.dll/statutes/1/54260/54675
      - https://pub.njleg.state.nj.us/Bills/2026/PL26/25_.PDF
  cookies:
    summary: No cookie-consent rule. Controllers that process data for targeted advertising or sell it must let consumers opt out, and since 15 July 2025 must honour a user-selected universal opt-out mechanism such as Global Privacy Control. The Division may set technical rules for such signals.
    source:
      - https://lis.njleg.state.nj.us/nxt/gateway.dll/statutes/1/54260/54674
      - https://pub.njleg.state.nj.us/Bills/2022/PL23/266_.PDF
  marketing:
    summary: Telemarketers must register with the Division of Consumer Affairs every year, must not call numbers on the state no-call list (built on the federal registry) or between 9 p.m. and 8 a.m., must identify themselves within 30 seconds, and must not block caller ID. Email and text marketing otherwise follow federal CAN-SPAM and the TCPA.
    source:
      - https://lis.njleg.state.nj.us/nxt/gateway.dll/statutes/1/54260/54616
      - https://lis.njleg.state.nj.us/nxt/gateway.dll/statutes/1/54260/54622
      - https://lis.njleg.state.nj.us/nxt/gateway.dll/statutes/1/54260/54623
  breach_notice:
    summary: Before telling customers, report the breach to the New Jersey State Police. Then notify affected residents in the most expedient time possible and without unreasonable delay, unless misuse isn't reasonably possible (document that and keep it 5 years). If more than 1,000 people are notified, also tell the national consumer reporting agencies.
    source:
      - https://lis.njleg.state.nj.us/nxt/gateway.dll/statutes/1/54260/54661
      - https://pub.njleg.state.nj.us/Bills/2004/PL05/226_.PDF
  registration_or_fees:
    summary: Since 30 June 2026, data brokers, and businesses that sell data they collect to data brokers, must register with the Division every year and pay a fee from $5,000 to $1.5 million depending on how many New Jersey consumers' data they handle. Missing registration costs $2,500 a day. Telemarketers register separately.
    source:
      - https://pub.njleg.state.nj.us/Bills/2026/PL26/25_.PDF
      - https://lis.njleg.state.nj.us/nxt/gateway.dll/statutes/1/54260/54683
      - https://lis.njleg.state.nj.us/nxt/gateway.dll/statutes/1/54260/54684
  dpo:
    summary: No duty to appoint a data protection officer.
    source:
      - https://pub.njleg.state.nj.us/Bills/2022/PL23/266_.PDF
  transfers:
    summary: No cross-border transfer rules (federal rules are in us-federal). Processors must work under a binding contract. Since 30 June 2026, data brokers and businesses that supply them may not sell or license sensitive data to anyone.
    source:
      - https://pub.njleg.state.nj.us/Bills/2022/PL23/266_.PDF
      - https://pub.njleg.state.nj.us/Bills/2026/PL26/25_.PDF
  dpia:
    summary: Before processing that presents a heightened risk, such as targeted advertising, sale, sensitive data or risky profiling, controllers must conduct and document a data protection assessment. The Division of Consumer Affairs can ask for it; it stays confidential.
    source:
      - https://lis.njleg.state.nj.us/nxt/gateway.dll/statutes/1/54260/54675
  automated_decisions_ai:
    summary: Consumers can opt out of profiling in furtherance of decisions with legal or similarly significant effects, and risky profiling needs a documented assessment. We found no New Jersey AI law with duties for private businesses.
    source:
      - https://lis.njleg.state.nj.us/nxt/gateway.dll/statutes/1/54260/54673
      - https://lis.njleg.state.nj.us/nxt/gateway.dll/statutes/1/54260/54675
  penalties:
    summary: Only the Attorney General enforces. The required 30-day cure notice ended on 1 July 2026. Violations are unlawful practices under the Consumer Fraud Act, with penalties up to $10,000 for a first offence and $20,000 for each later one. Selling sensitive data costs $50,000 per record. There's no private right of action under the privacy law.
    source:
      - https://lis.njleg.state.nj.us/nxt/gateway.dll/statutes/1/54260/54680
      - https://lis.njleg.state.nj.us/nxt/gateway.dll/statutes/1/54260/54682
      - https://lis.njleg.state.nj.us/nxt/gateway.dll/statutes/1/54260/54482
      - https://pub.njleg.state.nj.us/Bills/2026/PL26/25_.PDF
