# United Kingdom. Summarised in Bansat's own words from the official sources linked below.
# Not legal advice: check the sources before relying on any fact.
id: uk
name: United Kingdom
tier: full
laws:
  - name: UK GDPR
    citation: Regulation (EU) 2016/679 as it forms part of UK law, as amended
    official_url: https://www.legislation.gov.uk/eur/2016/679/contents
    status: in-force
    in_force_from: "2021-01-01"
    notes: The UK's retained version of the EU GDPR, read with the Data Protection Act 2018.
  - name: Data Protection Act 2018
    citation: 2018 c. 12
    official_url: https://www.legislation.gov.uk/ukpga/2018/12/contents
    status: in-force
    in_force_from: "2018-05-25"
  - name: Privacy and Electronic Communications (EC Directive) Regulations 2003 (PECR)
    citation: SI 2003/2426
    official_url: https://www.legislation.gov.uk/uksi/2003/2426/contents
    status: in-force
    in_force_from: "2003-12-11"
    notes: Cookies and similar technologies, and electronic marketing.
  - name: Data (Use and Access) Act 2025
    citation: 2025 c. 18
    official_url: https://www.legislation.gov.uk/ukpga/2025/18/contents
    status: in-force
    in_force_from: "2025-06-19"
    notes: Amends the three laws above, in stages. Most data protection and PECR changes took effect on 5 February 2026, the complaints duty on 19 June 2026, and the Information Commission replaced the ICO on 30 September 2026.
regulators:
  - name: Information Commission (successor to the Information Commissioner's Office since 30 September 2026)
    url: https://ico.org.uk
obligations:
  scope:
    summary: UK GDPR covers processing in the context of a UK establishment, and processing by organisations outside the UK that offer goods or services to people in the UK or monitor their behaviour there. Such organisations usually need a UK representative.
    source:
      - https://www.legislation.gov.uk/eur/2016/679/article/3
      - https://www.legislation.gov.uk/eur/2016/679/article/27
  lawful_bases:
    summary: Six lawful bases (Art. 6). Since 5 February 2026, a short list of "recognised legitimate interests" needs no balancing test, such as preventing crime, safeguarding children and vulnerable adults, emergencies and national security. Commercial analytics and marketing aren't on the list.
    source:
      - https://www.legislation.gov.uk/eur/2016/679/article/6
      - https://www.legislation.gov.uk/eur/2016/679/annex/1
  consent_age:
    summary: When an online service offered directly to a child relies on consent, children can consent for themselves from 13. Below that, a parent must give or authorise consent.
    value: 13
    source:
      - https://www.legislation.gov.uk/ukpga/2018/12/section/9
      - https://www.legislation.gov.uk/eur/2016/679/article/8
  children:
    summary: The Age Appropriate Design Code applies to online services likely to be used by under-18s, with high-privacy defaults and minimal data. Since 5 February 2026, such services must also take children's higher protection needs into account in data protection by design (Art. 25).
    source:
      - https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/childrens-information/childrens-code-guidance-and-resources/
      - https://www.legislation.gov.uk/ukpga/2025/18/section/81
  cookies:
    summary: Storing or reading information on a device needs consent after clear information. Exceptions are what's strictly necessary for a service the user asked for and, since 5 February 2026, analytics used only to improve the service and adapting a site's appearance or functions, as long as people get clear information and a free, simple way to object.
    source:
      - https://www.legislation.gov.uk/uksi/2003/2426/regulation/6
      - https://www.legislation.gov.uk/uksi/2003/2426/schedule/A1
  marketing:
    summary: Marketing emails and texts to individuals need prior consent, unless the soft opt-in applies (details collected in a sale or negotiation, similar products only, and an opt-out at collection and in every message). Since 5 February 2026 charities have their own soft opt-in for supporters.
    source:
      - https://www.legislation.gov.uk/uksi/2003/2426/regulation/22
  breach_notice:
    summary: Report a personal data breach to the regulator without undue delay and within 72 hours of becoming aware of it, unless it's unlikely to risk people's rights. Tell the people affected without undue delay when the risk to them is high.
    value: 72
    source:
      - https://www.legislation.gov.uk/eur/2016/679/article/33
      - https://www.legislation.gov.uk/eur/2016/679/article/34
  registration_or_fees:
    summary: Controllers pay an annual data protection fee unless exempt. Tier 1 (micro) £52, Tier 2 (small and medium) £78, Tier 3 (large) £3,763, with £5 off for paying by direct debit.
    source:
      - https://www.legislation.gov.uk/uksi/2018/480/regulation/3
      - https://ico.org.uk/for-organisations/data-protection-fee/
  dpo:
    summary: Appoint a data protection officer if you're a public authority, or if your core activities involve large-scale regular and systematic monitoring, or large-scale special category or criminal offence data.
    source:
      - https://www.legislation.gov.uk/eur/2016/679/article/37
  transfers:
    summary: Transfers outside the UK need UK adequacy regulations, appropriate safeguards such as the International Data Transfer Agreement or the Addendum to the EU's standard contractual clauses, or a listed exception. A transfer risk assessment is now called a "data protection test".
    source:
      - https://www.legislation.gov.uk/eur/2016/679/article/44
      - https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/international-transfers/
  dpia:
    summary: Carry out a data protection impact assessment before processing that's likely to be high risk to people, such as large-scale special category data or systematic monitoring. Consult the regulator first if a high risk remains after mitigation.
    source:
      - https://www.legislation.gov.uk/eur/2016/679/article/35
      - https://www.legislation.gov.uk/eur/2016/679/article/36
  automated_decisions_ai:
    summary: Since 5 February 2026, significant decisions based solely on automated processing are allowed with safeguards. People must be told about them and be able to make representations, get human intervention and contest the decision. Stricter limits apply when special category data is used.
    source:
      - https://www.legislation.gov.uk/eur/2016/679/article/22A
      - https://www.legislation.gov.uk/eur/2016/679/article/22C
  penalties:
    summary: Fines up to £17.5 million or 4% of worldwide annual turnover, whichever is higher, for the most serious UK GDPR infringements, and up to £8.7 million or 2% for others. Since 5 February 2026, PECR breaches are fined under the same powers.
    source:
      - https://www.legislation.gov.uk/ukpga/2018/12/section/157
      - https://www.legislation.gov.uk/uksi/2003/2426/schedule/1
