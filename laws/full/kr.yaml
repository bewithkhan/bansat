  transfers:
    summary: Transferring personal information abroad (providing, entrusting, storing or letting it be viewed) needs separate consent after set notice, a law or treaty, a need under a contract with the person that is disclosed in the privacy policy or notified, a recipient certified as the PIPC specifies, or a destination the PIPC finds equivalent (Art. 28-8). The EU and EEA are recognised from 16 September 2025, with a review due to start 3 months before 15 September 2028; a UK review began in October 2026. The PIPC can order transfers to stop (Art. 28-9).
    source:
      - https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B0%9C%EC%9D%B8%EC%A0%95%EB%B3%B4%EB%B3%B4%ED%98%B8%EB%B2%95/%EC%A0%9C28%EC%A1%B0%EC%9D%988
