  automated_decisions_ai:
    summary: People can refuse fully automated decisions, including by AI, that significantly affect their rights or duties, and can ask for an explanation; the controller must respond within 30 days (Art. 37-2; Decree Art. 44-3). Since 22 January 2026, the AI Basic Act requires prior notice of high-impact or generative AI, labels on generated output, clear marking of realistic synthetic media, and risk, explanation and oversight duties for high-impact AI (Arts. 31 and 34). Fines reach KRW 30 million (Art. 43), but MSIT said it would wait at least a year before imposing them.
    source:
