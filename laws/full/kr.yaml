# South Korea. Summarised in Bansat's own words from the official sources linked below.
# Not legal advice: check the sources before relying on any fact.
id: kr
name: South Korea
tier: full
laws:
  - name: Personal Information Protection Act (PIPA)
    citation: 개인정보 보호법, Act No. 10465 of 29 March 2011, as last amended by Act No. 21445 of 10 March 2026
    official_url: https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B0%9C%EC%9D%B8%EC%A0%95%EB%B3%B4%EB%B3%B4%ED%98%B8%EB%B2%95
    status: in-force
    in_force_from: "2011-09-30"
    notes: In force six months after promulgation (Addenda Art. 1), which we derive as 30 September 2011, the day its Enforcement Decree also took effect. The 2023 overhaul (Act No. 19234) applied from 15 September 2023, and its automated-decision and CPO rules from 15 March 2024 (both derived). Act No. 20897 on domestic agents applied from 2 October 2025 (derived). Act No. 21445 applies from 11 September 2026, as law.go.kr lists, except mandatory certification, from 1 July 2027.
  - name: Enforcement Decree of the Personal Information Protection Act
    citation: 개인정보 보호법 시행령, Presidential Decree No. 23169 of 29 September 2011, as last amended by Presidential Decree No. 36804 of 10 November 2026
    official_url: https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B0%9C%EC%9D%B8%EC%A0%95%EB%B3%B4%EB%B3%B4%ED%98%B8%EB%B2%95%EC%8B%9C%ED%96%89%EB%A0%B9
    status: in-force
    in_force_from: "2011-09-30"
    notes: In force from 30 September 2011 (Addenda Art. 1). Presidential Decree No. 36671, in force from 11 September 2026, set the rules for CPO reporting, surcharges and possible-leak notices; its list of the largest controllers also covers universities with 20,000 or more students, tertiary general hospitals and public system operators (Art. 32(3)). An amendment on ISMS-P certification audits was put out for comment from 16 September to 26 October 2026 (PIPC release, copy on korea.kr) and is still pending.
  - name: PIPA amendment on using personal information to develop AI
    citation: 개인정보 보호법 일부개정법률, Act No. 21910 of 8 September 2026
    official_url: https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=289415&efYd=20270309&ancYnChk=1
    status: enacted
    in_force_from: "2027-03-09"
    notes: Passed by the National Assembly on 20 August 2026, according to the PIPC's release of that day (copy on korea.kr). Adds a route (Arts. 28-12 to 28-15) for using lawfully collected personal information to develop AI, with the PIPC's approval and stronger safeguards. In force six months after promulgation (Addenda), which we derive as 9 March 2027, the date law.go.kr gives.
  - name: Framework Act on the Development of Artificial Intelligence and Establishment of Trust (AI Basic Act)
    citation: 인공지능 발전과 신뢰 기반 조성 등에 관한 기본법, Act No. 20676 of 21 January 2025, as amended by Act No. 21311 of 20 January 2026
    official_url: https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EC%9D%B8%EA%B3%B5%EC%A7%80%EB%8A%A5%EB%B0%9C%EC%A0%84%EA%B3%BC%EC%8B%A0%EB%A2%B0%EA%B8%B0%EB%B0%98%EC%A1%B0%EC%84%B1%EB%93%B1%EC%97%90%EA%B4%80%ED%95%9C%EA%B8%B0%EB%B3%B8%EB%B2%95
    status: in-force
    in_force_from: "2026-01-22"
    notes: In force one year after promulgation (Addenda Art. 1), which we derive as 22 January 2026; Act No. 21311 also names that date. Some of its own changes apply from 21 July 2026, six months after promulgation (derived; law.go.kr lists it). The Enforcement Decree (Presidential Decree No. 36053) applies from 22 January 2026. In November 2025 MSIT said it would run a grace period of at least a year before imposing fines, and confirmed it when the Act took effect in January 2026.
  - name: Act on Promotion of Information and Communications Network Utilization and Information Protection (Network Act)
    citation: 정보통신망 이용촉진 및 정보보호 등에 관한 법률, wholly amended by Act No. 6360 of 16 January 2001, as last amended by Act No. 21988 of 29 September 2026
    official_url: https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EC%A0%95%EB%B3%B4%ED%86%B5%EC%8B%A0%EB%A7%9D%EC%9D%B4%EC%9A%A9%EC%B4%89%EC%A7%84%EB%B0%8F%EC%A0%95%EB%B3%B4%EB%B3%B4%ED%98%B8%EB%93%B1%EC%97%90%EA%B4%80%ED%95%9C%EB%B2%95%EB%A5%A0
    status: in-force
    in_force_from: "2001-07-01"
    notes: The wholly amended Act took effect on 1 July 2001 (Addenda Art. 1). Sets the rules for advertising messages (Art. 50), app access permissions (Art. 22-2) and reporting intrusion incidents such as hacking (Art. 48-3). Act No. 21500 of 31 March 2026, in force from 1 October 2026 (derived, six months after promulgation), added user notice of some incidents and fines of up to KRW 50 million for late incident reports.
regulators:
  - name: Personal Information Protection Commission (PIPC)
    url: https://www.pipc.go.kr/eng/index.do
  - name: Ministry of Science and ICT (MSIT), for the AI Basic Act and the Network Act's security rules
    url: https://www.msit.go.kr/index.do
obligations:
  scope:
    summary: PIPA applies to personal information controllers, meaning public bodies, companies, organisations and individuals that process personal information files for their work (Art. 2). The PIPC applies it to foreign businesses serving people in Korea; in May 2025 it fined Temu KRW 1.369 billion, including for breaching the transfer rules. Those with no address in Korea and revenue of KRW 1 trillion or more, data of 1 million or more people in Korea stored on an average day, or a PIPC decision, must appoint a domestic agent in writing (Art. 31-2; Decree Art. 32-3).
    source:
      - https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B0%9C%EC%9D%B8%EC%A0%95%EB%B3%B4%EB%B3%B4%ED%98%B8%EB%B2%95/%EC%A0%9C2%EC%A1%B0
