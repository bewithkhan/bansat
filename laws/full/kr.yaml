  registration_or_fees:
    summary: No general registration or fee. Since 11 September 2026, the largest controllers, such as those with revenue over KRW 180 billion processing sensitive or unique ID data of 50,000 or more people or any data of 1 million or more, must report their CPO to the PIPC (Art. 31(3); Decree Art. 32(3)). Some ICT service providers need ISMS certification (Network Act Art. 47). From 1 July 2027, controllers meeting criteria still to be set by decree must hold PIPA certification (Art. 32-2). Foreign AI businesses above set thresholds must report a domestic agent to MSIT (AI Basic Act Art. 36).
    source:
