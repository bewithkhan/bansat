  cookies:
    summary: There is no separate cookie-consent rule; personal information collected through cookies needs a PIPA legal basis. Privacy policies must explain automatic collection devices, such as cookies, and how to refuse them (Art. 30). Under the Network Act, apps must tell users which phone data and functions they access and why, get consent, and not refuse service over optional permissions (Art. 22-2), and installing programs that show ads or collect personal information needs consent (Art. 50-5).
    source:
      - https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B0%9C%EC%9D%B8%EC%A0%95%EB%B3%B4%EB%B3%B4%ED%98%B8%EB%B2%95/%EC%A0%9C30%EC%A1%B0
