  breach_notice:
    summary: Within 72 hours of learning of a leak, tell those affected; urgent containment can come first (Art. 34; Decree Art. 39). Report to the PIPC or KISA within 72 hours if 1,000 or more people, sensitive or unique ID data, or hacking is involved (Decree Art. 40). Since 11 September 2026, leaks include alteration and damage (such as ransomware); warn all whose data may have leaked if those affected are unknown (Decree Art. 39-2); and no report is needed if retrieving or deleting the data makes harm much less likely (Art. 40(1)). ICT providers report intrusions in 24 hours (Network Act Art. 48-3).
    value: 72
    unit: hours
    source:
