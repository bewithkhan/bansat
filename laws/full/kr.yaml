  consent_age:
    summary: Where PIPA requires consent for a child under 14, get it from the legal representative and confirm it, for example by text message, card details, mobile phone verification, a signed form or e-mail (Art. 22-2; Decree Art. 17-2). Only the representative's name and contact details may be collected from the child without that consent.
    value: 14
    unit: years
    source:
      - https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B0%9C%EC%9D%B8%EC%A0%95%EB%B3%B4%EB%B3%B4%ED%98%B8%EB%B2%95/%EC%A0%9C22%EC%A1%B0%EC%9D%982
      - https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B0%9C%EC%9D%B8%EC%A0%95%EB%B3%B4%EB%B3%B4%ED%98%B8%EB%B2%95%EC%8B%9C%ED%96%89%EB%A0%B9/%EC%A0%9C17%EC%A1%B0%EC%9D%982
  children:
    summary: Notices to under-14s about how their data is handled must use an easy format and clear, simple language (Art. 22-2(3)). Processing their data without a legal representative's consent can lead to a surcharge of up to 3% of turnover, and to up to 5 years in prison or a KRW 50 million fine (Arts. 64-2 and 71).
    source:
      - https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B0%9C%EC%9D%B8%EC%A0%95%EB%B3%B4%EB%B3%B4%ED%98%B8%EB%B2%95/%EC%A0%9C22%EC%A1%B0%EC%9D%982
