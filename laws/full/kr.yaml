  lawful_bases:
    summary: "Collection and use need one of: consent; a specific legal provision or legal duty; a public body's legal task; a contract with the person, or steps they asked for; urgent protection of life, body or property; legitimate interests that clearly outweigh the person's rights, within limits; or urgent public safety (Art. 15). Related purposes are allowed with safeguards. Ask for each consent separately, including for marketing (Art. 22). Sensitive data and unique identifiers need separate consent or a legal basis, and resident registration numbers are restricted (Arts. 23 to 24-2)."
    source:
      - https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B0%9C%EC%9D%B8%EC%A0%95%EB%B3%B4%EB%B3%B4%ED%98%B8%EB%B2%95/%EC%A0%9C15%EC%A1%B0
