  penalties:
    summary: Surcharges reach 3% of total turnover, leaving out unrelated turnover, or KRW 2 billion without turnover. Since 11 September 2026, the cap is 10% (KRW 5 billion) for intentional or grossly negligent repeat violations within 3 years, such violations affecting 10 million or more people, or leaks after ignoring a corrective order (Art. 64-2). Administrative fines reach KRW 50 million (Art. 75); crimes, up to 10 years in prison (Art. 70). Courts can award up to 5 times the damage for wilful or grossly negligent leaks, or up to KRW 3 million without proof of loss (Arts. 39 and 39-2).
    source:
      - https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B0%9C%EC%9D%B8%EC%A0%95%EB%B3%B4%EB%B3%B4%ED%98%B8%EB%B2%95/%EC%A0%9C64%EC%A1%B0%EC%9D%982
