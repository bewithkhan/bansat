  dpia:
    summary: Public institutions must assess the privacy impact of set personal information files; other controllers must actively try to do so where there's a risk (Art. 33). Businesses offering high-impact AI must try to assess its effect on fundamental rights beforehand (AI Basic Act Art. 35). From 9 March 2027, using personal information under the new AI development route can require a prior risk assessment (Art. 28-12).
    source:
