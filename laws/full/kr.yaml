  marketing:
    summary: Advertising messages sent electronically need explicit prior consent, unless you got the contact details in a transaction and advertise similar goods within 6 months of it ending. Messages from 9 pm to 8 am need separate consent, except e-mail. Identify the sender, give an easy free opt-out, confirm the result of each choice and re-check consent every 2 years (Network Act Art. 50; Decree Arts. 61 and 62-3). Fines reach KRW 30 million (Art. 76); evading opt-outs or hiding the sender is a crime (Arts. 50(5) and 74). PIPA also requires separate consent for marketing (Art. 22).
    source:
      - https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EC%A0%95%EB%B3%B4%ED%86%B5%EC%8B%A0%EB%A7%9D%EC%9D%B4%EC%9A%A9%EC%B4%89%EC%A7%84%EB%B0%8F%EC%A0%95%EB%B3%B4%EB%B3%B4%ED%98%B8%EB%93%B1%EC%97%90%EA%B4%80%ED%95%9C%EB%B2%95%EB%A5%A0/%EC%A0%9C74%EC%A1%B0
