  dpo:
    summary: Every controller needs a chief privacy officer (CPO); in small businesses it's the owner or CEO (Art. 31; Decree Art. 32). The largest controllers need a qualified CPO and, since 11 September 2026, board approval for companies to appoint, change or remove one, and a report to the PIPC within 6 months, extendable by up to a year; CPOs already in post must be reported within 6 months of that date (Art. 31(3); Decree Art. 32; Addenda Art. 2). The CPO must work independently; the CEO is ultimately responsible (Art. 30-3). A domestic agent must be the Korean subsidiary if any (Art. 31-2).
    source:
      - https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B0%9C%EC%9D%B8%EC%A0%95%EB%B3%B4%EB%B3%B4%ED%98%B8%EB%B2%95/%EC%A0%9C31%EC%A1%B0
