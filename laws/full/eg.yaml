# Egypt. Summarised in Bansat's own words from the official sources linked below.
# Not legal advice: check the sources before relying on any fact.
# The PDPC's Guidelines page serves the law and its executive regulations as Arabic scans of the official gazette,
# with the PDPC's English guidelines. Court of Cassation records confirm their numbers and publication dates.
id: eg
name: Egypt
tier: full
laws:
  - name: Personal Data Protection Law (PDPL)
    citation: Law No. 151 of 2020 issuing the Personal Data Protection Law (Official Gazette No. 28 bis (h), 15 July 2020)
    official_url: https://cc.gov.eg/legislation/3007991608
    status: in-force
    in_force_from: "2020-10-16"
    notes: Derived date, three months after the day following publication (issuing Art. 7). Those covered had one year from the issue of the executive regulations to comply (Art. 6), which on a plain reading ended on or about 1 November 2026; no official extension was found. The PDPC says processing without the required licence or permit after that period is a violation. The link is the Court of Cassation's record; the gazette text is on the PDPC's Guidelines page.
  - name: Executive Regulations of the Personal Data Protection Law
    citation: Minister of Communications and Information Technology Decision No. 816 of 2025 (Al-Waqai Al-Misriya No. 244 cont. (A), 1 November 2025)
    official_url: https://cc.gov.eg/legislation/3269947493
    status: in-force
    in_force_from: "2025-11-02"
    notes: Derived date, the day after publication, as the decision provides. The regulations set licence and permit categories and fees, breach reporting, DPO registration, rules for children's and sensitive data, transfers and direct e-marketing, and require controllers and processors abroad to appoint an approved representative in Egypt. No amendment was found in the Court of Cassation's records.
  - name: Anti-Cyber and Information Technology Crimes Law
    citation: Law No. 175 of 2018 on Combating Information Technology Crimes (Official Gazette No. 32 bis (c), 14 August 2018)
    official_url: https://elec.eecourts.gov.eg/assets/laws/21-%20%D9%82%D8%A7%D9%86%D9%88%D9%86%20%D9%85%D9%83%D8%A7%D9%81%D8%AD%D8%A9%20%D8%AC%D8%B1%D8%A7%D8%A6%D9%85%20%D8%AA%D9%82%D9%86%D9%8A%D8%A9%20%D8%A7%D9%84%D9%85%D8%B9%D9%84%D9%88%D9%85%D8%A7%D8%AA.pdf
    status: in-force
    in_force_from: "2018-08-15"
    notes: Derived date, the day after publication (Art. 45). Service providers, including anyone who processes or stores information for users, must keep system logs, such as data identifying users and traffic and device data, for 180 continuous days, keep them confidential and secure, and publish their name, contact and licence details (Art. 2). Breaching the retention duty carries a fine of EGP 5,000,000 to 10,000,000 (Art. 33). The link is the Economic Courts' copy of the text.
  - name: No AI-specific law yet
    citation: None adopted. The National Council for AI's Guide to Egypt's National AI Governance Framework (March 2026) isn't legislation
    official_url: https://ai.gov.eg/SynchedFiles/ar/Resources/Guide%20to%20Egypt%E2%80%99s%20National%20AI%20Governance%20Framework.pdf
    status: none
    notes: Egypt has no AI law. The guide sorts AI systems into four risk tiers (prohibited, high, limited and minimal risk) and says its use will inform the drafting of an Egyptian AI law. The Personal Data Protection Law applies to personal data in AI systems.
regulators:
  - name: Personal Data Protection Center (PDPC)
    url: https://pdpc.gov.eg/
obligations:
  scope:
    summary: The law covers personal data of natural persons processed electronically, wholly or partly, by any holder, controller or processor (issuing Art. 1). Its offences also reach foreigners abroad where the act is a crime there too and the data concerns Egyptians or residents (Art. 2). It excludes data kept for personal use, official statistics, media use, court and investigation records, national security bodies, and the Central Bank and firms it supervises other than money transfer and exchange firms (Art. 3). Firms abroad with no branch in Egypt must appoint a PDPC-approved representative.
    source:
      - https://pdpc.gov.eg/guidelines
      - https://cc.gov.eg/legislation/3007991608
  lawful_bases:
    summary: Collecting, processing or disclosing personal data needs the person's explicit consent or a case the law allows (Art. 2). Processing must rest on one of six bases in Art. 6, namely consent, a contract, a legal obligation, a legitimate interest, a legal claim or defence, or a court judgment or investigative order. Data must be collected for legitimate, specific and declared purposes, kept accurate and secure, and held no longer than needed (Art. 3). The PDPC's guidelines, which say they aren't binding, add that consent must be explicit, informed, specific and freely given.
    source:
      - https://pdpc.gov.eg/guidelines
  consent_age:
    summary: The regulations draw a line at 15 (Art. 15). For a child under 15, get the guardian's explicit written consent, on paper or electronically, before collecting data, stating how long it lasts. From 15 to 18 the text still calls for the guardian's consent, which the child or the guardian may submit. The PDPC's consent and lawful bases guidelines read it differently, saying a child over 15 may consent if the guardian knows. Because the sources differ, no single consent age is given here.
    source:
      - https://pdpc.gov.eg/guidelines
      - https://cc.gov.eg/legislation/3269947493
  children:
    summary: Children's data counts as sensitive data, so processing it needs a PDPC licence or permit and the guardian's consent (Art. 12; regulations Art. 14). A child's part in a game, contest or other activity must not depend on giving more data than needed, and that data must not be used to profile, track or monitor children's behaviour (regulations Art. 14). Keep secure records of guardians' consents and of requests to delete, change or stop processing. Breaking the sensitive data rules carries at least three months in prison, a fine of EGP 500,000 to 5,000,000, or both (Art. 41).
    source:
      - https://pdpc.gov.eg/guidelines
  cookies:
    summary: Neither the law nor the regulations mention cookies; the general consent and notice rules apply. The PDPC's compliance checklist asks whether non-essential cookies, pixels and SDKs stay off until the user gives explicit, informed consent, whether choices are offered by category, whether preferences can be changed or withdrawn at any time, and whether the site still works if all are refused. Its consent guidelines call it unlawful to cut off a service, such as email, when a user withdraws consent to marketing cookies.
    source:
      - https://pdpc.gov.eg/guidelines
  marketing:
    summary: Electronic direct marketing needs the person's consent, and each message must identify who created and sent it, give a valid address, say it's for direct marketing and offer an easy way to refuse or withdraw (Art. 17). Senders must set the marketing purpose, not disclose contact details, and keep electronic records of consent for three years from the last message (Art. 18). The regulations add that senders need a PDPC e-marketing licence and explicit consent, and must delete the data when consent is withdrawn (Art. 18). Fines are EGP 200,000 to 2,000,000 (Art. 43).
    source:
      - https://pdpc.gov.eg/guidelines
      - https://pdpc.gov.eg/faq
  breach_notice:
    summary: Report a personal data breach to the PDPC, through its portal or hotline, within 72 hours of becoming aware of it, or immediately if it concerns national security (Art. 7; regulations Art. 5). The report covers when it was found, what happened, the likely harm, the steps taken and the DPO's details, and goes in a secure log. Tell the people affected within three working days of reporting to the PDPC, by the contact method agreed when they consented. Breaching these duties carries a fine of EGP 300,000 to 3,000,000 (Art. 38).
    value: 72
    unit: hours
    source:
      - https://pdpc.gov.eg/guidelines
      - https://pdpc.gov.eg/faq
  registration_or_fees:
    summary: Controllers and processors need a PDPC licence for ongoing processing or a permit for occasional processing; the PDPC says licences last three years and permits one year. Sensitive data needs a licence (Art. 12), and transfers abroad and e-marketing need their own. Fees can reach EGP 2,000,000 for a licence and EGP 500,000 for a permit or accreditation (Art. 26). For legal persons, the regulations make up to 100,000 records free, then EGP 200 to 1,000 a year up to a million, rising to the cap above five million. Licence breaches carry a fine of EGP 500,000 to 5,000,000 (Art. 45).
    source:
      - https://pdpc.gov.eg/guidelines
      - https://pdpc.gov.eg/faq
  dpo:
    summary: A controller or processor that is a legal person must appoint a competent employee as data protection officer and enter them in the PDPC's register; a natural person who controls or processes data is personally responsible (Art. 8). The DPO assesses and tests protection systems and documents the results, is the contact point for the PDPC, handles requests, reports breaches, keeps records up to date and runs training (Art. 9). The PDPC says the DPO may be Egyptian or foreign but must be registered. A legal representative who doesn't comply faces a fine of EGP 200,000 to 2,000,000 (Art. 39).
    source:
      - https://pdpc.gov.eg/guidelines
      - https://pdpc.gov.eg/faq
  transfers:
    summary: Data may be transferred, stored or shared abroad only where the country's protection is no lower than Egypt's, and with a PDPC licence or permit (Art. 14). With the person's explicit consent, it may go elsewhere in listed cases, such as vital interests, legal claims, a contract for the person's benefit, judicial cooperation, public interest, money transfers or treaties (Art. 15). Sharing with a controller or processor abroad also needs matching purposes and a legitimate interest (Art. 16). Breaches carry at least three months in prison, a fine of EGP 500,000 to 5,000,000, or both (Art. 42).
    source:
      - https://pdpc.gov.eg/guidelines
      - https://pdpc.gov.eg/faq
  dpia:
    summary: The law doesn't name an impact assessment. The DPO must regularly assess and test the personal data protection systems, document the results and recommend measures (Art. 9). The PDPC's guidelines, which say they aren't binding, expect data protection impact assessments when needed, with the documents kept, and a documented transfer impact assessment before cross-border transfers. Its FAQ lists carrying out DPIAs among the DPO's tasks.
    source:
      - https://pdpc.gov.eg/guidelines
      - https://pdpc.gov.eg/faq
  automated_decisions_ai:
    summary: No specific rule on automated decisions. People may object to processing of their data, or to its results, where it conflicts with their fundamental rights and freedoms (Art. 2). The PDPC's principles guidelines list automated decisions with legal or similarly significant effects and no human oversight as a factor in judging whether processing is fair. Egypt has no AI law; the National Council for AI's March 2026 guide sorts AI systems into four risk tiers and says it will inform the drafting of an AI law.
    source:
      - https://pdpc.gov.eg/guidelines
      - https://ai.gov.eg/SynchedFiles/ar/Resources/Guide%20to%20Egypt%E2%80%99s%20National%20AI%20Governance%20Framework.pdf
  penalties:
    summary: Breaches are crimes tried by the Economic Courts, with a minimum and maximum fine for each offence. Processing without consent or legal basis costs EGP 100,000 to 1,000,000, or at least six months in prison and up to EGP 2,000,000 if done for gain or to cause harm (Art. 36). Security and breach duties carry EGP 300,000 to 3,000,000 (Art. 38), and sensitive data, transfer and licence breaches EGP 500,000 to 5,000,000 (Arts. 41, 42 and 45). Managers can be liable and penalties double for repeat offences. The PDPC can also warn, suspend or revoke licences. Settlement is possible (Art. 49).
    source:
      - https://pdpc.gov.eg/guidelines
      - https://cc.gov.eg/legislation/3007991608
