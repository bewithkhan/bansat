# Oregon (United States). Summarised in Bansat's own words from the official sources linked below.
# Not legal advice: check the sources before relying on any fact.
id: us-or
name: Oregon
tier: full
applies_with: [us-federal]
laws:
  - name: Oregon Consumer Privacy Act (OCPA)
    citation: ORS 646A.570 to 646A.589
    official_url: https://www.oregonlegislature.gov/bills_laws/ors/ors646A.html
    status: in-force
    in_force_from: "2024-07-01"
    notes: Applies to non-profits from 1 July 2025. 2025 amendments cover car makers and, from 1 January 2026, ban selling precise geolocation data and the data of under-16s.
  - name: Oregon Consumer Information Protection Act
    citation: ORS 646A.600 to 646A.628
    official_url: https://www.oregonlegislature.gov/bills_laws/ors/ors646A.html
    status: in-force
    in_force_from: "2007-10-01"
    notes: Data security and breach notification.
  - name: Data broker registration
    citation: ORS 646A.593
    official_url: https://www.oregonlegislature.gov/bills_laws/ors/ors646A.html
    status: in-force
    in_force_from: "2024-01-01"
  - name: Artificial intelligence companions (SB 1546)
    citation: Oregon Laws 2026, chapter 85
    official_url: https://www.oregonlegislature.gov/bills_laws/lawsstatutes/2026orLaw0085.pdf
    status: enacted
    in_force_from: "2027-01-01"
