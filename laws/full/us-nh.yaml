# New Hampshire. Summarised in Bansat's own words from the official sources linked below.
# Not legal advice: check the sources before relying on any fact.
id: us-nh
name: New Hampshire
tier: full
applies_with: [us-federal]
laws:
  - name: New Hampshire privacy law (Expectation of Privacy)
    citation: RSA ch. 507-H (Laws 2024, ch. 5)
    official_url: https://gc.nh.gov/rsa/html/LII/507-H/507-H-mrg.htm
    status: in-force
    in_force_from: "2025-01-01"
    notes: Laws 2026, ch. 168 (HB 1460, signed on 19 June 2026) bars selling a child's personal data from 1 January 2027; the online RSA doesn't show it yet.
  - name: Notice of security breach
    citation: RSA 359-C:19 to 359-C:21
    official_url: https://gc.nh.gov/rsa/html/XXXI/359-C/359-C-20.htm
    status: in-force
    in_force_from: "2007-01-01"
  - name: AI chat services and children (responsive generative communication)
    citation: RSA 507:8-k and RSA 639:3, III-a (Laws 2025, ch. 270, HB 143)
    official_url: https://gc.nh.gov/rsa/html/LII/507/507-8-k.htm
    status: in-force
    in_force_from: "2026-01-01"
    notes: Signed on 1 August 2025. Creates civil liability and a misdemeanour for AI chat services that knowingly push a child toward listed harms.
regulators:
  - name: New Hampshire Department of Justice (Attorney General), Consumer Protection and Antitrust Bureau
    url: https://www.doj.nh.gov/
obligations:
  scope:
    summary: Applies to businesses operating in New Hampshire or targeting its residents that in a year control or process data of 35,000+ unique consumers (excluding payment-only data), or 10,000+ while earning over 25% of revenue from selling data. Non-profits, colleges, government, GLBA financial institutions and HIPAA-regulated bodies are exempt. Employees and B2B contacts aren't consumers.
    source:
      - https://gc.nh.gov/rsa/html/LII/507-H/507-H-2.htm
      - https://gc.nh.gov/rsa/html/LII/507-H/507-H-3.htm
  lawful_bases:
    summary: No GDPR-style lawful bases. Controllers give a privacy notice and honour rights to access, correct, delete and port data and to opt out of targeted advertising, sale and solely automated profiling for significant decisions, within 45 days (extendable by 45). Sensitive data needs opt-in consent, which must be as easy to withdraw as to give; processing stops within 15 days of withdrawal.
    source:
      - https://gc.nh.gov/rsa/html/LII/507-H/507-H-4.htm
      - https://gc.nh.gov/rsa/html/LII/507-H/507-H-6.htm
  consent_age:
    summary: A child is under 13 (as in COPPA), and a known child's data must be processed as COPPA requires. Teens aged 13 to 15 must opt in before their data is sold or used for targeted advertising, where the controller has actual knowledge of their age and wilfully disregards it.
    value: 13
    unit: years
    source:
      - https://gc.nh.gov/rsa/html/LII/507-H/507-H-1.htm
      - https://gc.nh.gov/rsa/html/LII/507-H/507-H-6.htm
  children:
    summary: Data from a known child (under 13, as in COPPA) is sensitive data and needs COPPA-compliant handling. From 1 January 2027, Laws 2026, ch. 168 bars selling a child's personal data. Since 1 January 2026, an AI chat service whose sole purpose is open-ended generative conversation is liable if it knowingly sends a child messages meant to get them to imminently engage in sexual conduct, illegal drug or alcohol use, self-harm or violence. We found no New Hampshire age-appropriate design law.
    source:
      - https://gc.nh.gov/rsa/html/LII/507-H/507-H-6.htm
      - https://gc.nh.gov/rsa/html/LII/507-H/507-H-1.htm
      - https://gc.nh.gov/bill_status/billinfo.aspx?id=2443
      - https://gc.nh.gov/rsa/html/LII/507/507-8-k.htm
      - https://gc.nh.gov/rsa/html/LXII/639/639-3.htm
  cookies:
    summary: No cookie-consent rule. Controllers must offer a clear opt-out link for targeted advertising and sale, and since 1 January 2025 must honour opt-out preference signals such as Global Privacy Control. A signal that conflicts with a loyalty programme or existing setting must still be honoured, though the controller may ask the consumer to confirm.
    source:
      - https://gc.nh.gov/rsa/html/LII/507-H/507-H-6.htm
  marketing:
    summary: Anyone using an automatic dialling system to solicit must register with the Department of Justice's Consumer Protection and Antitrust Bureau at least 10 business days before. Telemarketers must not call numbers on the do-not-call registry, must say at once who is calling and why, and must not block caller ID. Violations can cost $5,000 each, and people can sue. Federal CAN-SPAM and the TCPA apply too.
    source:
      - https://gc.nh.gov/rsa/html/XXXI/359-E/359-E-mrg.htm
  breach_notice:
    summary: After learning of a breach, promptly assess whether the data has been or will be misused. Unless misuse is unlikely, notify affected people as soon as possible, and notify the Attorney General's office (or your primary regulator) with the expected notice date and the number of New Hampshire residents affected. If more than 1,000 people are notified, also tell the national consumer reporting agencies.
    source:
      - https://gc.nh.gov/rsa/html/XXXI/359-C/359-C-20.htm
  registration_or_fees:
    summary: The privacy law has no registration or fee, and we found no New Hampshire data broker registry. Users of automatic dialling systems for solicitation register with the Department of Justice and pay a $20 annual fee.
    source:
      - https://gc.nh.gov/rsa/html/LII/507-H/507-H-mrg.htm
      - https://gc.nh.gov/rsa/html/XXXI/359-E/359-E-mrg.htm
  dpo:
    summary: No duty to appoint a data protection officer.
    source:
      - https://gc.nh.gov/rsa/html/LII/507-H/507-H-mrg.htm
  transfers:
    summary: New Hampshire law has no cross-border transfer rules (federal rules are in us-federal).
    source:
      - https://gc.nh.gov/rsa/html/LII/507-H/507-H-mrg.htm
  dpia:
    summary: Controllers must conduct and document an assessment before targeted advertising, sale, sensitive data processing or risky profiling, for processing activities created after 1 July 2024. The Attorney General can require one in an investigation; it stays confidential.
    source:
      - https://gc.nh.gov/rsa/html/LII/507-H/507-H-8.htm
  automated_decisions_ai:
    summary: Consumers can opt out of profiling in furtherance of solely automated decisions with legal or similarly significant effects, and risky profiling needs a documented assessment. Since 1 January 2026, an AI chat service whose sole purpose is open-ended generative conversation faces civil liability and a misdemeanour charge if it knowingly pushes a child toward imminent sexual conduct, drug or alcohol use, self-harm or violence. Cloud and telecom providers, and chatbots built into games, TV or streaming, are excluded.
    source:
      - https://gc.nh.gov/rsa/html/LII/507-H/507-H-4.htm
      - https://gc.nh.gov/rsa/html/LII/507-H/507-H-8.htm
      - https://gc.nh.gov/rsa/html/LII/507/507-8-k.htm
      - https://gc.nh.gov/rsa/html/LXII/639/639-3.htm
      - https://gc.nh.gov/bill_status/billinfo.aspx?id=339
  penalties:
    summary: Only the Attorney General enforces. The required 60-day cure notice applied only during 2025; since 2026 a cure is at the AG's discretion. Violations are unfair or deceptive acts under RSA 358-A, with civil penalties up to $10,000 per violation. The privacy law gives no private right of action. Under the AI chat law, only the AG can sue, after written notice and 90 days to give assurances of a cure, for the child's damages (at least $1,000 per violation) or an injunction.
    source:
      - https://gc.nh.gov/rsa/html/LII/507-H/507-H-11.htm
      - https://gc.nh.gov/rsa/html/XXXI/358-A/358-A-mrg.htm
      - https://gc.nh.gov/rsa/html/LII/507/507-8-k.htm
