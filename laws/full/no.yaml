# Norway. Summarised in Bansat's own words from the official sources linked below.
# Not legal advice: check the sources before relying on any fact.
# Norway is in the EEA, so read this entry with the EU entry: the GDPR applies through the EEA Agreement.
# Lovdata, which holds the consolidated statutes, blocks automated access. Law links point to the
# text the Storting adopted or to the regulator's guidance instead; check Lovdata for later amendments.
id: "no"
name: Norway
tier: full
applies_with: [eu]
laws:
  - name: Personal Data Act (personopplysningsloven)
    citation: LOV-2018-06-15-38
    official_url: https://stortinget.no/no/Saker-og-publikasjoner/Vedtak/Beslutninger/Lovvedtak/2017-2018/vedtak-201718-054/
    status: in-force
    in_force_from: "2018-07-20"
    notes: Makes the GDPR, as incorporated into the EEA Agreement, part of Norwegian law and adds national rules. The link is the text the Storting adopted on 22 May 2018.
  - name: Electronic Communications Act (ekomloven)
    citation: LOV-2024-12-13-76
    official_url: https://stortinget.no/no/Saker-og-publikasjoner/Vedtak/Beslutninger/Lovvedtak/2024-2025/vedtak-202425-001/
    status: in-force
    in_force_from: "2025-01-01"
    notes: Replaced the 2003 Act. Section 3-15 sets the cookie rules. The link is the text the Storting adopted on 5 November 2024.
  - name: Marketing Control Act (markedsføringsloven)
    citation: LOV-2009-01-09-2
    official_url: https://www.forbrukertilsynet.no/lov-og-rett/veiledninger-og-retningslinjer/forbrukertilsynets-veiledning-markedsforing-via-e-post-sms-o-l
    status: in-force
    in_force_from: "2009-06-01"
    notes: Section 15 covers e-mail, SMS and similar marketing, and section 12 telemarketing. The link is the Consumer Authority's guidance, which quotes section 15.
  - name: Act on artificial intelligence (KI-loven)
    citation: Draft act to implement the EU AI Act, Regulation (EU) 2024/1689, sent for consultation in 2025
    official_url: https://nkom.no/ki
    status: draft
    notes: Not law yet. The EU AI Act isn't yet part of the EEA Agreement, so it doesn't apply in Norway yet. Nkom coordinates the work on the Norwegian act.
regulators:
  - name: Datatilsynet (Norwegian Data Protection Authority)
    url: https://www.datatilsynet.no/en/regulations-and-tools/regulations/
  - name: Nasjonal kommunikasjonsmyndighet (Nkom), which supervises the cookie rule with Datatilsynet
    url: https://nkom.no/
  - name: Forbrukertilsynet (Norwegian Consumer Authority), for marketing rules
    url: https://www.forbrukertilsynet.no/english
obligations:
  scope:
    summary: The GDPR applies as Norwegian law through the Personal Data Act. It covers processing in the context of a controller or processor established in Norway, and by organisations outside the EEA that offer goods or services to people in Norway or monitor their behaviour there. Those need a representative in the EEA. The government can apply the Act to Svalbard and Jan Mayen by regulation. Journalism and academic, artistic or literary expression are largely exempt.
    source:
      - https://stortinget.no/no/Saker-og-publikasjoner/Vedtak/Beslutninger/Lovvedtak/2017-2018/vedtak-201718-054/
      - https://www.datatilsynet.no/regelverk-og-verktoy/lover-og-regler/om-personopplysningsloven-og-nar-den-gjelder/
  lawful_bases:
    summary: The six GDPR lawful bases apply. National rules add grounds for special category data in employment, and for archiving, research and statistics, where the controller must first consult its data protection officer unless it has done a DPIA. Datatilsynet can permit special category processing in an important public interest. National identity numbers may only be used where secure identification is genuinely needed.
    source:
      - https://stortinget.no/no/Saker-og-publikasjoner/Vedtak/Beslutninger/Lovvedtak/2017-2018/vedtak-201718-054/
      - https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02016R0679-20160504
  consent_age:
    summary: When an information society service offered directly to a child relies on consent, children can consent for themselves from 13. Below that, a parent must consent. Norway's EEA notification of September 2025 says the 13 doesn't apply to providers established in another EEA state, and proposes raising the age to 15 for all providers serving children in Norway. That change is pending. For other processing, Datatilsynet's view is that a parent usually consents until 18, unless the child is mature enough to understand the processing in question.
    value: 13
    unit: years
    source:
      - https://stortinget.no/no/Saker-og-publikasjoner/Vedtak/Beslutninger/Lovvedtak/2017-2018/vedtak-201718-054/
      - https://www.datatilsynet.no/personvern-pa-ulike-omrader/skole-barn-unge/samtykkje-fra-mindrearige/
      - https://technical-regulation-information-system.ec.europa.eu/da/notification/27273/print
  children:
    summary: The GDPR's protections for children apply. Datatilsynet's guidance notes other ages in Norwegian law, such as 15 for joining associations and 16 for seeking health care alone. A social media age limit is planned but isn't law yet. The draft bill, notified under the EEA procedure for technical rules in May 2026, would let children use social media from the year they turn 16, with platforms checking ages.
    source:
      - https://www.datatilsynet.no/personvern-pa-ulike-omrader/skole-barn-unge/samtykkje-fra-mindrearige/
      - https://technical-regulation-information-system.ec.europa.eu/da/notification/27935/print
    secondary:
      - https://cms.law/no/nor/publikasjon/norge-innfoerer-aldersgrense-for-sosiale-medier-dette-boer-du-vite
  cookies:
    summary: Since 1 January 2025, storing or reading information on a user's device needs consent that meets the GDPR standard (Electronic Communications Act section 3-15). The only exceptions are technical transmission and what's strictly necessary for a service the user explicitly asked for. Refusing must be as easy as accepting. Nkom and Datatilsynet share supervision.
    source:
      - https://nkom.no/internett/informasjonskapsler-cookies
      - https://nkom.no/informasjonskapsler
      - https://stortinget.no/no/Saker-og-publikasjoner/Vedtak/Beslutninger/Lovvedtak/2024-2025/vedtak-202425-001/
  marketing:
    summary: E-mail, SMS and similar marketing to individuals needs prior consent (Marketing Control Act section 15), including at personal work addresses. Existing customers can get marketing for the seller's own similar products if they were offered a free, easy opt-out when their address was collected and in every message. Generic company addresses aren't covered. Telemarketing to consumers in the Reservation Register is banned unless they're customers or donors, or asked to be called.
    source:
      - https://www.forbrukertilsynet.no/lov-og-rett/veiledninger-og-retningslinjer/forbrukertilsynets-veiledning-markedsforing-via-e-post-sms-o-l
      - https://www.forbrukertilsynet.no/vi-jobber-med/telefonsalg-uonsket-reklame
  breach_notice:
    summary: The GDPR rule applies. Report a personal data breach to Datatilsynet without undue delay and within 72 hours of becoming aware of it, unless it's unlikely to risk people's rights. Tell the people affected without undue delay when the risk to them is high. Since 1 October 2025, the Digital Security Act also requires online marketplaces, search engines and cloud services based in Norway to report incidents that significantly affect their service without undue delay, or risk a fine. Those based outside the EEA need a representative in Norway, or in another EEA state where they offer services.
    value: 72
    unit: hours
    source:
      - https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02016R0679-20160504
      - https://www.datatilsynet.no/rettigheter-og-plikter/virksomhetenes-plikter/avvik/
      - https://stortinget.no/globalassets/pdf/lovvedtak/2023-2024/vedtak-202324-015.pdf
      - https://www.finanstilsynet.no/nyhetsarkiv/nyheter/2025/informasjon-om-digitalsikkerhetsloven-i-finanssektoren/
    secondary:
      - https://schjodt.com/news/norways-digital-security-act-now-in-effect
  registration_or_fees:
    summary: There's no general registration or fee. An organisation that appoints a data protection officer, whether it must or chooses to, has to register the officer's contact details with Datatilsynet through an Altinn form.
    source:
      - https://www.datatilsynet.no/rettigheter-og-plikter/virksomhetenes-plikter/personvernombud/registrer-personvernombud/
      - https://stortinget.no/no/Saker-og-publikasjoner/Vedtak/Beslutninger/Lovvedtak/2017-2018/vedtak-201718-054/
  dpo:
    summary: The GDPR rule applies. Appoint a data protection officer if you're a public body, or your core activities involve large-scale regular and systematic monitoring, or large-scale special category or criminal offence data. Norwegian law adds a duty of confidentiality for the officer and lets the government extend the duty to appoint one by regulation.
    source:
      - https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02016R0679-20160504
      - https://stortinget.no/no/Saker-og-publikasjoner/Vedtak/Beslutninger/Lovvedtak/2017-2018/vedtak-201718-054/
      - https://www.datatilsynet.no/rettigheter-og-plikter/virksomhetenes-plikter/personvernombud/
  transfers:
    summary: The GDPR rules apply to transfers outside the EEA. Use an adequacy decision, an appropriate safeguard such as standard contractual clauses or binding corporate rules, or one of the listed derogations, such as explicit consent. The Personal Data Act lets the government add transfer rules by regulation.
    source:
      - https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02016R0679-20160504
      - https://stortinget.no/no/Saker-og-publikasjoner/Vedtak/Beslutninger/Lovvedtak/2017-2018/vedtak-201718-054/
  dpia:
    summary: The GDPR rule applies. Datatilsynet's national list names processing that always needs a DPIA, such as systematic monitoring of employees, or biometric, genetic or location data combined with another risk factor such as large scale. Consult Datatilsynet before starting if a high risk remains.
    source:
      - https://www.datatilsynet.no/globalassets/global/dokumenter-pdfer-skjema-ol/regelverk/veiledere/dpia-veileder/dpialist280119.pdf
      - https://www.datatilsynet.no/rettigheter-og-plikter/virksomhetenes-plikter/vurdering-av-personvernkonsekvenser/
      - https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02016R0679-20160504
  automated_decisions_ai:
    summary: The GDPR rule on decisions based solely on automated processing applies. The EU AI Act isn't yet part of the EEA Agreement, so it doesn't apply in Norway yet, and the timing is unclear. A draft Norwegian AI act to implement it was sent for consultation in 2025 but isn't law yet. Nkom coordinates the work.
    source:
      - https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02016R0679-20160504
      - https://www.stortinget.no/no/Hva-skjer-pa-Stortinget/EU-EOS-informasjon/EU-EOS-nytt/2026/eueos-nytt--12.-juni-2026/ny-code-of-practice-om-merking-av-ki-generert-innhold-etter-ki-forordningen/
      - https://nkom.no/ki
    secondary:
      - https://www.digi.no/artikler/nye-eu-regler-for-ki-norge-og-eos-henger-enna-langt-etter/575266
      - https://www.altinget.no/artikkel/ny-forsinkelse-for-ki-loven
  penalties:
    summary: Datatilsynet can fine up to EUR 20 million or 4% of worldwide annual turnover under the GDPR. Norwegian law applies the EUR 10 million or 2% tier to breaches of GDPR Articles 10 and 24 too. Datatilsynet can fine public bodies, and set a daily coercive fine until an order is met. Appeals go to the Privacy Appeals Board (Personvernnemnda). Forbrukertilsynet can impose infringement fines for breaking the marketing rules.
    source:
      - https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02016R0679-20160504
      - https://stortinget.no/no/Saker-og-publikasjoner/Vedtak/Beslutninger/Lovvedtak/2017-2018/vedtak-201718-054/
      - https://www.forbrukertilsynet.no/lov-og-rett/veiledninger-og-retningslinjer/forbrukertilsynets-veiledning-markedsforing-via-e-post-sms-o-l
