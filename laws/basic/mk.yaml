# North Macedonia. Summarised in Bansat's own words from the official sources linked below.
# Not legal advice: check the sources before relying on any fact.
id: mk
name: North Macedonia
tier: basic
laws:
  - name: Law on Personal Data Protection
    citation: Закон за заштита на личните податоци (Службен весник на РСМ бр. 42/2020, 294/2021 и 101/2025)
    official_url: https://azlp.mk/wp-content/uploads/2022/11/zakon_za_zastita_na_licnite_podatoci.pdf
    status: in-force
    in_force_from: "2020-02-24"
    notes: GDPR-style law that replaced the 2005 law. Published on 16 February 2020 and in force on the eighth day after (Art. 124; date derived). Controllers and processors had 18 months from then to comply (Art. 119). The link is the Agency's copy of the 2020 text as published; the 2021 amendment made small wording changes, and the 2025 one is listed below.
  - name: Law supplementing the Law on Personal Data Protection (2025)
    citation: Закон за дополнување на Законот за заштита на личните податоци (Службен весник на РСМ бр. 101/2025)
    official_url: https://azlp.mk/wp-content/uploads/2026/01/Zakon_za_dopolnuvanje_na_ZZLP-1.pdf
    status: in-force
    in_force_from: "2025-05-21"
    notes: In force on publication, 21 May 2025 (Art. 4). Transfers to NATO member countries now sit outside the third-country transfer rules, as transfers to EU and EEA countries already did, but the controller or processor must notify the Agency of them (Arts. 48 and 56).
  - name: Rulebook on the security of processing of personal data
    citation: Правилник за безбедност на обработката на личните податоци (Службен весник на РСМ бр. 266/2024)
    official_url: https://azlp.mk/wp-content/uploads/2024/12/3883c28cedfc4121830dff38e76fbcf6_71f0972d-2c13-425_241226_100852.pdf
    status: in-force
    in_force_from: "2025-01-02"
    notes: The Agency's rules for the technical and organisational measures controllers must plan, put in place, review and update to keep processing secure. Published on 25 December 2024 and in force on the eighth day after (date derived), it has applied since 1 July 2025 and replaced the 2020 rulebook (Arts. 10 and 11).
regulators:
  - name: Personal Data Protection Agency (AZLP)
    url: https://azlp.mk/
