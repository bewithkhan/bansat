# Slovenia. Summarised in Bansat's own words from the official sources linked below.
# Not legal advice: check the sources before relying on any fact.
# The legal information system (pisrs.si) refused automated requests, so the law links point to the texts
# as published in the Official Gazette (Uradni list). Check PISRS for later amendments.
id: si
name: Slovenia
tier: basic
applies_with: [eu]
laws:
  - name: Personal Data Protection Act (ZVOP-2)
    citation: Zakon o varstvu osebnih podatkov (ZVOP-2), Uradni list RS, št. 163/22
    official_url: https://www.uradni-list.si/glasilo-uradni-list-rs/vsebina/2022-01-4187/zakon-o-varstvu-osebnih-podatkov-zvop-2
    status: in-force
    in_force_from: "2023-01-26"
    notes: Replaced the 2004 Act and supplements the GDPR. A child can consent to information society services from 15; below that, a parent or guardian must give or approve consent (Art. 8). Art. 23 applies the information security law's risk-management and incident rules for essential entities to some systems, such as those processing data of over 100,000 people under a statute or special category data of over 10,000 people. ZInfV-1 updated it from 19 June 2025 (derived as the 15th day after publication on 4 June 2025). Date derived from Art. 127 as the 30th day after publication on 27 December 2022.
  - name: Electronic Communications Act (ZEKom-2)
    citation: Zakon o elektronskih komunikacijah (ZEKom-2), Uradni list RS, št. 130/22
    official_url: https://www.uradni-list.si/glasilo-uradni-list-rs/vsebina/2022-01-3081/zakon-o-elektronskih-komunikacijah-zekom-2
    status: in-force
    in_force_from: "2022-11-10"
    notes: Cookies and similar technologies need consent after clear and full information on the controller and purposes; browser or app settings can express it where technically possible. The Information Commissioner inspects compliance (Art. 225). Marketing by automated calls, SMS, MMS, fax or email to subscribers who are natural persons needs prior consent, with a soft opt-in for a business's own similar products (Art. 226(1), (2), (4)). The date is derived from Art. 323, which brings it into force on the 30th day after publication on 11 October 2022.
  - name: Act Implementing the EU Regulation on Artificial Intelligence (ZIUDHPUI)
    citation: Zakon o izvajanju uredbe (EU) o določitvi harmoniziranih pravil o umetni inteligenci (ZIUDHPUI), Uradni list RS, št. 85/25
    official_url: https://www.uradni-list.si/glasilo-uradni-list-rs/vsebina/2025-01-3035/zakon-o-izvajanju-uredbe-eu-o-dolocitvi-harmoniziranih-pravil-o-umetni-inteligenci-ziudhpui
    status: in-force
    in_force_from: "2025-11-21"
    notes: Slovenia's law for carrying out the EU AI Act. The communications agency AKOS is the single point of contact. Market surveillance is split between AKOS, the Information Commissioner (banned practices and some high-risk areas, such as biometrics), the central bank, the insurance supervisor and the Market Inspectorate (Arts. 6–7, 10). Breaches, including of the AI literacy duty, are offences with fines from EUR 25,000 for companies (EUR 100,000 for large ones), up to the AI Act's caps in serious cases (Arts. 25–34). Date derived from Art. 45 as the 15th day after publication on 6 November 2025.
