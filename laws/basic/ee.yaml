id: ee
name: Estonia
tier: basic
applies_with: [eu]
laws:
  - name: Personal Data Protection Act
    citation: Isikuandmete kaitse seadus (RT I, 04.01.2019, 11), as amended
    official_url: https://www.riigiteataja.ee/akt/IKS
    status: in-force
    in_force_from: "2019-01-15"
    notes: Specifies and supplements the GDPR. Children can consent to information society services from age 13 (§ 8). Breaches are handled as misdemeanours, with the Data Protection Inspectorate as the out-of-court body. Since 16 March 2026 it also sets fines of up to €20 million or 4% of turnover for breaching the targeting rules of the EU political advertising regulation (Regulation (EU) 2024/900, Arts. 18–19; § 71^1). Last amended with effect from 1 October 2026.
  - name: Electronic Communications Act
    citation: Elektroonilise side seadus (RT I 2004, 87, 593), as amended
    official_url: https://www.riigiteataja.ee/akt/ESS
    status: in-force
    in_force_from: "2005-01-01"
    notes: Holds the ePrivacy rules. Direct marketing to an individual's electronic contact details needs prior consent that meets the GDPR standard; businesses may be contacted if they can refuse each time; a seller may market its own similar products to customers who could refuse at collection and in each message (§ 103^1). A communications provider must tell customers why it processes communications data and let them refuse, except for data needed only to transmit a message or for an information society service the customer asked for (§ 102(3)–(4)).
regulators:
  - name: Data Protection Inspectorate (Andmekaitse Inspektsioon, AKI)
    url: https://www.aki.ee/
