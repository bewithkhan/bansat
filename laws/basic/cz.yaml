# Czechia. Summarised in Bansat's own words from the official sources linked below.
# Not legal advice: check the sources before relying on any fact.
id: cz
name: Czechia
tier: basic
applies_with: [eu]
laws:
  - name: Personal Data Processing Act
    citation: Zákon č. 110/2019 Sb., o zpracování osobních údajů
    official_url: https://e-sbirka.gov.cz/sb/2019/110
    status: in-force
    in_force_from: "2019-04-24"
    notes: The national law that adapts the GDPR. Children can consent to information society services from age 15 (§ 7). Amendments in 2024–2026 (Acts 448/2024, 218/2025, 230/2025 and 197/2026) came from laws on the civil service, tax administration, the police and state employees, not from changes to the GDPR rules for businesses.
  - name: Electronic Communications Act
    citation: Zákon č. 127/2005 Sb., o elektronických komunikacích
    official_url: https://e-sbirka.gov.cz/sb/2005/127
    status: in-force
    in_force_from: "2005-05-01"
    notes: Holds the cookie rule. Under § 89(3) anyone storing or reading data on a user's device needs the user's prior, demonstrable consent, unless it's strictly needed to send a message or provide a service the user asked for. This opt-in wording has applied since 1 January 2022 (Act 374/2021 Sb.).
  - name: Act on Certain Information Society Services
    citation: Zákon č. 480/2004 Sb., o některých službách informační společnosti
    official_url: https://e-sbirka.gov.cz/sb/2004/480
    status: in-force
    in_force_from: "2004-09-07"
    notes: Holds the email marketing rules. Commercial communications by electronic means need the recipient's prior consent, with an exception for a business's own similar products to existing customers who can refuse easily each time; every message must be marked as commercial and give a valid opt-out address (§ 7). The data protection office (ÚOOÚ) supervises these rules, which also protect companies.
regulators:
  - name: Office for Personal Data Protection (Úřad pro ochranu osobních údajů, ÚOOÚ)
    url: https://uoou.gov.cz/
