# Uzbekistan. Summarised in Bansat's own words from the official sources linked below.
# Not legal advice: check the sources before relying on any fact.
# The links are the national legislation database (lex.uz), run by the Ministry of Justice's Adolat centre. The texts
# used are in Uzbek, so the summaries rest on our own translation. The regulator link is the Department's page on the
# government portal (gov.uz), in Uzbek.
id: uz
name: Uzbekistan
tier: basic
laws:
  - name: Law on Personal Data
    citation: Law No. ZRU-547 of 2 July 2019 «Шахсга доир маълумотлар тўғрисида» (On Personal Data), as last amended in September 2026
    official_url: https://lex.uz/docs/4396419
    status: in-force
    in_force_from: "2019-10-01"
    notes: In force from 1 October 2019 (Art. 36). Covers processing and protection of personal data by any means, including IT; purely personal and household use, and state secrets and defence data, are outside it (Art. 3). Databases that must be kept in Uzbekistan go on the State Register of Personal Data Databases (Art. 20). Art. 8 still names the State Personalization Centre as the authorised body, but a 2026 Cabinet resolution gives that role to the Interior Ministry's department (see below).
  - name: 2026 amendments on data localisation and transfers
    citation: Law No. ZRU-1125 of 26 March 2026 amending the Law on Personal Data (National Database of Legislation, 27 March 2026, No. 03/26/1125/0278)
    official_url: https://lex.uz/docs/8099215
    status: in-force
    in_force_from: "2026-03-27"
    notes: In force on official publication (Art. 4), on 27 March 2026. It rewrote Art. 27-1 and narrowed registration (Art. 20). Biometric and genetic data, and telecom operators' data on their users, must be stored in Uzbekistan. Other personal data may be stored and processed abroad if the country is on the Cabinet's list of countries giving equal protection, if the operator uses standard contractual clauses or binding corporate rules meeting the authority's requirements, or if it follows international standards on the authority's list.
  - name: List of countries giving equal protection of personal data
    citation: Cabinet of Ministers Resolution No. 415 of 29 July 2026 (National Database of Legislation, 3 August 2026, No. 09/26/415/0807)
    official_url: https://lex.uz/uz/docs/8369688
    status: in-force
    in_force_from: "2026-08-03"
    notes: In force 3 August 2026, the date lex.uz gives; the resolution itself states no start date. It lists 49 countries and territories (the United States only for companies in the EU-US Data Privacy Framework) and names the Interior Ministry's Department of Migration and Personalization as the authorised state body. Transfers to other countries must meet the conditions the authority sets. A leak during a cross-border transfer must be reported to it within 24 hours, with a full account within 72 hours.
regulators:
