id: fi
name: Finland
tier: basic
applies_with: [eu]
laws:
  - name: Data Protection Act
    citation: Tietosuojalaki (1050/2018), as amended
    official_url: https://www.finlex.fi/fi/lainsaadanto/2018/1050
    status: in-force
    in_force_from: "2019-01-01"
    notes: Specifies and supplements the GDPR. Children can consent to information society services from age 13 (§ 5). Amended several times since; the latest change, Act 380/2026 in force from 1 September 2026, amended §§ 4, 6, 7 and 14 (including the Ombudsman's tasks and powers) and added § 36 a on accrediting certification bodies.
  - name: Act on Electronic Communications Services
    citation: Laki sähköisen viestinnän palveluista (917/2014), as amended
    official_url: https://www.finlex.fi/fi/lainsaadanto/2014/917
    status: in-force
    in_force_from: "2015-01-01"
    notes: Chapter 24 holds the ePrivacy rules on electronic direct marketing and cookies. A service may store cookies or similar data on a user's device and use it only with the user's consent and clear, full information about the purpose, unless it's needed only to transmit a message or to provide a service the user asked for (§ 205). §§ 200–204 cover direct marketing to individuals and to organisations.
  - name: Act on the Supervision of Certain AI Systems
    citation: Laki eräiden tekoälyjärjestelmien valvonnasta (1377/2025)
    official_url: https://www.finlex.fi/fi/lainsaadanto/2025/1377
    status: in-force
    in_force_from: "2026-01-01"
    notes: National measures for the EU AI Act. The Data Protection Ombudsman is the market surveillance authority for prohibited AI practices (Art. 5; § 4). Traficom supervises the Art. 50 transparency duties, except for providers and deployers of high-risk systems, whose sector authorities under § 3 do (§ 5), and is the single point of contact (§ 6). A sanctions board at Traficom can impose administrative fines. Issued 22 December 2025, published 29 December 2025, in force from 1 January 2026 (§ 29).
regulators:
  - name: Office of the Data Protection Ombudsman (Tietosuojavaltuutetun toimisto)
    url: https://tietosuoja.fi/en/
