id: be
name: Belgium
tier: basic
applies_with: [eu]
laws:
  - name: Data Protection Act of 30 July 2018
    citation: Loi du 30 juillet 2018 relative à la protection des personnes physiques à l'égard des traitements de données à caractère personnel (M.B. 05.09.2018)
    official_url: https://www.autoriteprotectiondonnees.be/publications/loi-cadre.pdf
    status: in-force
    in_force_from: "2018-09-05"
    notes: The framework law that supplements the GDPR. It entered into force on the day it was published in the Moniteur belge (Art. 281). Children can consent to information society services from age 13 (Art. 7). The regulator's cookie checklist cites Art. 10/2 of this law, added by a later amendment, as the rule that storing or reading information on a user's device (cookies, pixels, fingerprinting, local storage) needs prior consent. The linked file is the 2018 publication, so it doesn't show Art. 10/2.
  - name: Act establishing the Data Protection Authority
    citation: Loi du 3 décembre 2017 portant création de l'Autorité de protection des données (M.B. 10.01.2018), as amended
    official_url: https://www.autoriteprotectiondonnees.be/publications/loi-organique-de-l-apd.pdf
    status: in-force
    in_force_from: "2018-05-25"
    notes: Sets up the Data Protection Authority, which replaced the Privacy Commission (Art. 3), with its inspection service and Litigation Chamber. In force from 25 May 2018, except Chapter III (Art. 110). The linked file is the text as updated to 5 September 2018. Its header says a revised version took effect on 1 June 2024 and applies to complaints, mediation, requests, inspections and Litigation Chamber cases started from that date, so the linked text now governs only older cases.
regulators:
  - name: Data Protection Authority (Autorité de protection des données / Gegevensbeschermingsautoriteit)
    url: https://www.dataprotectionauthority.be/
