# Bahrain. Summarised in Bansat's own words from the official sources linked below.
# Not legal advice: check the sources before relying on any fact.
# The links point to the Legislation and Legal Opinion Commission (LLOC), which holds the Arabic texts, Official
# Gazette issues and its own English translations. Summaries of Arabic-only texts rest on our own translation.
# The regulator link is Decree No. 78 of 2019 (Official Gazette No. 3439, 3 October 2019): the Ministry of Justice,
# Islamic Affairs and Waqf exercises the Authority's powers until the Authority's budget is allocated and its board
# formed. Decision No. 80 of 2025 still cites the decree.
id: bh
name: Bahrain
tier: basic
laws:
  - name: Personal Data Protection Law (PDPL)
    citation: Law No. (30) of 2018 issuing the Personal Data Protection Law (قانون رقم (30) لسنة 2018 بإصدار قانون حماية البيانات الشخصية), Official Gazette No. 3375, 19 July 2018
    official_url: https://www.lloc.gov.bh/Legislation/id/K3018
    status: in-force
    in_force_from: "2019-08-01"
    notes: Derived date, the first day of the month after a year from publication on 19 July 2018 (issuing law, Art. 4). Covers anyone resident or with a place of business in Bahrain, and others using means there to process data; such a company must name a local representative. Controllers notify the Authority before automated processing (with exemptions), need prior authorisation for some processing, and send data abroad only to adequate countries, under an exception such as consent or a contract, or with authorisation. Serious breaches carry up to a year in prison and/or a fine of BHD 1,000 to 20,000.
  - name: Ministerial Decisions implementing the PDPL
    citation: Minister of Justice, Islamic Affairs and Waqf Decisions Nos. (42) to (51) of 2022, Official Gazette No. 3593, 17 March 2022
    official_url: https://www.lloc.gov.bh/OG/3593.pdf
    status: in-force
    in_force_from: "2022-03-18"
    notes: Derived date, the day after publication (each decision's final article). Ten decisions cover transfers abroad with a list of adequate countries (No. 42), security measures, including telling the Authority of a breach within 72 hours of discovery unless it is unlikely to cause harm (No. 43), notification and prior authorisation (No. 44), sensitive data (No. 45), data protection guardians and their fees (Nos. 46 and 47), data subject rights (No. 48), complaints (No. 49), criminal case data (No. 50) and public registers (No. 51).
  - name: Data portability amendment
    citation: Minister of Justice, Islamic Affairs and Waqf Decision No. (80) of 2025 adding Article 3 bis to Decision No. (48) of 2022 on data subject rights, Official Gazette No. 3836, 2 October 2025
    official_url: https://www.lloc.gov.bh/Legislation/id/RJIW8025
    status: in-force
    in_force_from: "2025-10-03"
    notes: Derived date, the day after publication (Art. 2). Data subjects can get their personal data that a controller obtained for processing under the law in a structured, machine-readable format, and can ask the controller to pass it to another controller where that is necessary and technically possible.
regulators:
  - name: Personal Data Protection Authority, whose powers the Ministry of Justice, Islamic Affairs and Waqf exercises under Decree No. 78 of 2019
    url: https://www.lloc.gov.bh/Legislation/id/D7819
