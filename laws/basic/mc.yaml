id: mc
name: Monaco
tier: basic
laws:
  - name: Law No. 1.565 on the protection of personal data
    citation: Loi n° 1.565 du 3 décembre 2024 relative à la protection des données personnelles (Journal de Monaco, 13 December 2024)
    official_url: https://legimonaco.mc/tnc/loi/2024/12-03-1.565/
    status: in-force
    in_force_from: "2024-12-14"
    notes: Replaced Law No. 1.165 of 1993 with GDPR-style rules, and the APDP replaced the CCIN. Start date derived from publication on 13 December 2024 and Article 69 of the Constitution (effective the next day). Existing processing had one year to comply, and three to redo impact assessments. Breaches go to the APDP within 72 hours where possible. The adequate-country list is set by Ministerial Order 2026-548 (Journal de Monaco, 16 October 2026).
  - name: Sovereign Ordinance No. 11.327 implementing Law No. 1.565
    citation: Ordonnance Souveraine n° 11.327 du 10 juillet 2025 portant application de la loi n° 1.565 du 3 décembre 2024 (Journal de Monaco, 18 July 2025)
    official_url: https://legimonaco.mc/tnc/ordonnance/2025/07-10-11.327/
    status: in-force
    in_force_from: "2025-07-19"
    notes: Start date derived from publication on 18 July 2025 and Article 69 of the Constitution. Sets the procedures for people's rights requests, controller and processor duties, the APDP, processing that needs prior formalities, and international transfers. Ministerial Order 2025-361, published the same day, lists the criteria for high-risk processing that needs an impact assessment.
regulators:
  - name: Personal Data Protection Authority (Autorité de Protection des Données Personnelles, APDP), successor to the CCIN
    url: https://apdp.mc/
