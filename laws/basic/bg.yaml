id: bg
name: Bulgaria
tier: basic
applies_with: [eu]
laws:
  - name: Personal Data Protection Act
    citation: Закон за защита на личните данни (ДВ бр. 1/2002), as amended; GDPR amendments in ДВ бр. 17 of 26 February 2019
    official_url: https://pernik-adms.justice.bg/upload/35731/ZZLD.pdf
    status: in-force
    in_force_from: "2002-01-01"
    notes: The national law read with the GDPR, rewritten for it by the 2019 amending act. In force since 1 January 2002 (§ 5 of the final provisions). Children under 14 need a parent's or guardian's consent, including for information society services offered to them (Art. 25c). The link is a consolidated text published by the Administrative Court of Pernik, current to State Gazette no. 93 of 26 November 2019; later changes couldn't be checked on an official site.
  - name: Electronic Commerce Act
    citation: Закон за електронната търговия (ДВ бр. 51/2006), as amended
    official_url: https://www.mtc.government.bg/sites/default/files/documents/2024-05/%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%B7%D0%B0%20%D0%B5%D0%BB%D0%B5%D0%BA%D1%82%D1%80%D0%BE%D0%BD%D0%BD%D0%B0%D1%82%D0%B0%20%D1%82%D1%8A%D1%80%D0%B3%D0%BE%D0%B2%D0%B8%D1%8F.pdf
    status: in-force
    in_force_from: "2006-12-24"
    notes: Holds the cookie and email marketing rules. Art. 4a lets a service store or read information on a user's device after giving clear GDPR Art. 13 information and a way to refuse; the ePrivacy Directive it implements calls for consent. Art. 6 bans unsolicited commercial email to consumers without prior consent, and to businesses on the opt-out register kept by the Commission for Consumer Protection. The link is the Ministry of Transport and Communications' consolidated copy.
regulators:
  - name: Commission for Personal Data Protection (CPDP)
    url: https://www.cpdp.bg/
