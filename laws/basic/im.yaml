# Isle of Man. Summarised in Bansat's own words from the official sources linked below.
# Not legal advice: check the sources before relying on any fact.
id: im
name: Isle of Man
tier: basic
laws:
  - name: Data Protection Act 2018
    citation: AT 10 of 2018
    official_url: https://consult.gov.im/cabinet-office/new-data-protection-bill/supporting_documents/DataProtectionAct2018_1%201.pdf
    status: in-force
    in_force_from: "2018-05-15"
    notes: A short enabling Act that lets the Council of Ministers apply the GDPR and the Law Enforcement Directive to the Island by order, with implementing regulations. Sections 3 to 7 have applied since 15 May 2018 under SD 2018/0142.
  - name: Data Protection (Application of GDPR) Order 2018
    citation: SD 2018/0143, as amended
    official_url: https://www.tynwald.org.im/links/tls/SD/2018/2018-SD-0143.pdf
    status: in-force
    in_force_from: "2018-05-16"
    notes: Applies the GDPR to the Island with modifications (the "applied GDPR") and repeals the Data Protection Act 2002. Its footnote explains that it took effect on 16 May 2018, when Tynwald approved it, not on the 1 May date it names.
  - name: GDPR and LED Implementing Regulations 2018
    citation: SD 2018/0145, as amended
    official_url: https://www.tynwald.org.im/links/tls/SD/2018/2018-SD-0145.pdf
    status: in-force
    in_force_from: "2018-08-01"
    notes: The detailed rules that go with the applied GDPR, including registration with the Information Commissioner. Fees are set by the Data Protection (Fees) Regulations 2018 at a flat rate. The Commissioner consulted in 2025 and in April 2026 recommended tiered fees; Treasury must make amending regulations, and none had been made when this entry was checked.
regulators:
  - name: Isle of Man Information Commissioner
    url: https://www.inforights.im/
