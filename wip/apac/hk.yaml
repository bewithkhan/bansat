# Hong Kong. Summarised in Bansat's own words from the official sources linked below.
# Not legal advice: check the sources before relying on any fact.
id: hk
name: Hong Kong
tier: full
laws:
  - name: Personal Data (Privacy) Ordinance (PDPO)
    citation: Cap. 486
    official_url: https://www.elegislation.gov.hk/hk/cap486!en
    status: in-force
    in_force_from: "1996-08-01"
    notes: e-Legislation records its commencement as 1 August 1996 (L.N. 343 of 1996). The direct marketing rules (Part 6A) apply from 1 April 2013 and the doxxing provisions from 8 October 2021. The current version dates from 1 October 2022. Section 33 on transfers abroad is not yet in operation.
  - name: Unsolicited Electronic Messages Ordinance (UEMO)
    citation: Cap. 593
    official_url: https://www.elegislation.gov.hk/hk/cap593!en
    status: in-force
    in_force_from: "2007-06-01"
    notes: The Ordinance commenced in two phases. Its rules for sending commercial electronic messages, and the do-not-call registers, apply from 22 December 2007, according to the regulator's announcement. Person-to-person interactive communications are not covered.
  - name: Protection of Critical Infrastructures (Computer Systems) Ordinance
    citation: Cap. 653
    official_url: https://www.elegislation.gov.hk/hk/cap653!en
    status: in-force
    in_force_from: "2026-01-01"
    notes: In operation from 1 January 2026 (L.N. 144 of 2025). Applies only to designated critical infrastructure operators and their critical computer systems.
regulators:
  - name: Privacy Commissioner for Personal Data (PCPD)
    url: https://www.pcpd.org.hk/
  - name: Office of the Communications Authority (OFCA), for the UEMO
    url: https://www.ofca.gov.hk/en/home/index.html
obligations:
  scope:
    summary: The PDPO applies to data users, meaning anyone who, alone or with others, controls the collection, holding, processing or use of personal data (s.2). It has no express territorial clause, but the Privacy Commissioner may decline a complaint unless the person was resident or present in Hong Kong, or the data user could control the data in or from Hong Kong (s.39). In doxxing cases, the Commissioner can serve cessation notices on service providers outside Hong Kong that serve people in Hong Kong (s.66M).
    source:
      - https://www.elegislation.gov.hk/hk/cap486!en/s2
      - https://www.elegislation.gov.hk/hk/cap486!en/s39
      - https://www.elegislation.gov.hk/hk/cap486!en/s66M
  lawful_bases:
    summary: There is no list of lawful bases. Collect personal data only for a lawful purpose directly related to your activities, by lawful and fair means, and no more than you need (DPP 1). On or before collection, tell people the purpose, who may receive the data and whether they must supply it. Using data for a new purpose, including disclosing it, needs the person's prescribed consent, which must be express and voluntary and can be withdrawn in writing (DPP 3; s.2(3)). Part 8 sets exemptions, such as for crime prevention.
    source:
      - https://www.elegislation.gov.hk/hk/cap486!en/sch1
      - https://www.elegislation.gov.hk/hk/cap486!en/s2
      - https://www.elegislation.gov.hk/hk/cap486!en/s58
  consent_age:
    summary: The PDPO sets no age at which a child can consent alone. Minors are under 18 (Cap. 1, s.3). A person with parental responsibility is the minor's relevant person, who can make access and correction requests for the minor. They can give prescribed consent to a new use only if the minor can't understand it and the use is clearly in the minor's interest, and the data user must also believe that (DPP 3(2) and (3)).
    source:
      - https://www.elegislation.gov.hk/hk/cap486!en/s2
      - https://www.elegislation.gov.hk/hk/cap486!en/sch1
      - https://www.elegislation.gov.hk/hk/cap1!en/s3
  children:
    summary: Beyond the relevant person rules for minors (see consent age), the PDPO has no rules written for children. The general principles apply to their data in full, including collecting only what's needed and telling them, on or before collection, what it's for. The doxxing offences also protect the family members of the person whose data is disclosed (s.64).
    source:
      - https://www.elegislation.gov.hk/hk/cap486!en/sch1
      - https://www.elegislation.gov.hk/hk/cap486!en/s64
  cookies:
    summary: There is no cookie-specific law. Where cookies or other tracking collect personal data, the collection rules apply, so collect only what's necessary and tell people, on or before collection, the purpose and who may receive the data (DPP 1). Data users must also make their personal data policies and practices, the kinds of data they hold and its main purposes generally available (DPP 5).
    source:
      - https://www.elegislation.gov.hk/hk/cap486!en/sch1
  marketing:
    summary: Before using personal data for direct marketing, tell the person which data and which classes of products are involved and get consent (no objection counts) through a free response channel; confirm oral consent in writing within 14 days. At first use, say they can opt out free, and stop when asked. Giving data to others for their marketing needs written consent (PDPO Part 6A). Commercial e-messages must name the sender, offer an unsubscribe option honoured within 10 working days, and avoid numbers on the do-not-call registers (UEMO).
    source:
      - https://www.elegislation.gov.hk/hk/cap486!en/s35C
      - https://www.elegislation.gov.hk/hk/cap486!en/s35J
      - https://www.elegislation.gov.hk/hk/cap593!en/s9
      - https://www.elegislation.gov.hk/hk/cap593!en/s10
      - https://www.elegislation.gov.hk/hk/cap593!en/s11
      - https://www.info.gov.hk/gia/general/200712/20/P200712200182.htm
  breach_notice:
    summary: The PDPO doesn't require breach notification; data users may notify the PCPD voluntarily under its guidance. In January 2025 the government said it was studying, with the PCPD, a mandatory notification scheme, possibly in phases. That is a proposal, not law. Since 1 January 2026, designated critical infrastructure operators must notify computer-system security incidents within 12 hours if the core function is or may be disrupted and within 48 hours otherwise, then send a written report within 14 days (Cap. 653).
    source:
      - https://www.info.gov.hk/gia/general/202501/22/P2025012200305.htm
      - https://www.elegislation.gov.hk/hk/cap653!en/s28
      - https://www.elegislation.gov.hk/hk/cap653!en/sch6
  registration_or_fees:
    summary: No registration or fee. The data user return scheme in Part 4 applies only to classes of data users that the Privacy Commissioner specifies by notice in the Gazette (s.14). Parties using the voluntary Greater Bay Area Standard Contract file it with the Digital Policy Office.
    source:
      - https://www.elegislation.gov.hk/hk/cap486!en/s14
      - https://www.digitalpolicy.gov.hk/en/our_work/digital_infrastructure/mainland/gbacbdf/cross-boundary_data_flow/
  dpo:
    summary: There is no duty to appoint a data protection officer. Data users must tell people, on or before first use of their data, the name or job title and address of the person who handles access and correction requests (DPP 1(3)).
    source:
      - https://www.elegislation.gov.hk/hk/cap486!en/sch1
  transfers:
    summary: Section 33, which would restrict transfers outside Hong Kong, has never been brought into operation. The general rules apply instead. A transfer is a use, so a new purpose needs prescribed consent (DPP 3), and a data user that engages a processor, in or outside Hong Kong, must use contracts or other means to protect the data and limit how long it's kept (DPP 2(3) and 4(2)). Between Hong Kong and nine Mainland Greater Bay Area cities, the voluntary GBA Standard Contract has been open to all sectors since 1 November 2024.
    source:
      - https://www.elegislation.gov.hk/hk/cap486!en/s33
      - https://www.elegislation.gov.hk/hk/cap486!en/sch1
      - https://www.info.gov.hk/gia/general/202411/01/P2024110100291.htm
      - https://www.digitalpolicy.gov.hk/en/our_work/digital_infrastructure/mainland/gbacbdf/cross-boundary_data_flow/
  dpia:
    summary: The PDPO doesn't require privacy impact assessments. Parties using the GBA Standard Contract must carry out a personal information protection impact assessment within three months before filing it.
    source:
      - https://www.elegislation.gov.hk/hk/cap486!en
      - https://www.digitalpolicy.gov.hk/en/our_work/digital_infrastructure/mainland/gbacbdf/cross-boundary_data_flow/
  automated_decisions_ai:
    summary: The PDPO has no rules on automated decisions, and there is no AI-specific statute. In January 2025 the government pointed instead to the PDPO and to non-binding guidance, including the PCPD's AI Model Personal Data Protection Framework. The Digital Policy Office's Generative AI Technical and Application Guideline (April 2025) is also guidance, not law.
    source:
      - https://www.info.gov.hk/gia/general/202501/22/P2025012200427.htm
      - https://www.info.gov.hk/gia/general/202504/15/P2025041500227.htm
  penalties:
    summary: No administrative fines. Breaching a PCPD enforcement notice is an offence (HK$50,000 and 2 years, plus HK$1,000 a day; HK$100,000 and HK$2,000 a day for repeats). Direct marketing breaches carry up to HK$500,000 and 3 years, or HK$1,000,000 and 5 years when data is provided for gain. Doxxing carries up to HK$100,000 and 2 years, or HK$1,000,000 and 5 years if harm results. People can claim compensation (s.66). Fines in Cap. 653 reach HK$5,000,000.
    source:
      - https://www.elegislation.gov.hk/hk/cap486!en/s50A
      - https://www.elegislation.gov.hk/hk/cap486!en/s35J
      - https://www.elegislation.gov.hk/hk/cap486!en/s64
      - https://www.elegislation.gov.hk/hk/cap486!en/s66
      - https://www.elegislation.gov.hk/hk/cap221!en/sch8
      - https://www.elegislation.gov.hk/hk/cap653!en/s28
