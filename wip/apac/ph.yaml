# Philippines. Summarised in Bansat's own words from the official sources linked below.
# Not legal advice: check the sources before relying on any fact.
id: ph
name: Philippines
tier: full
laws:
  - name: Data Privacy Act of 2012 (DPA)
    citation: Republic Act No. 10173
    official_url: https://privacy.gov.ph/data-privacy-act/
    status: in-force
    in_force_from: "2012-09-08"
    notes: Approved on 15 August 2012. It took effect 15 days after publication in two national newspapers (s.45). The official texts we opened don't give the publication date, so 8 September 2012, the date commonly cited, is derived and unconfirmed.
  - name: Implementing Rules and Regulations of the Data Privacy Act (IRR)
    citation: IRR of Republic Act No. 10173, promulgated 24 August 2016
    official_url: https://privacy.gov.ph/implementing-rules-regulations-data-privacy-act-2012/
    status: in-force
    in_force_from: "2016-09-09"
    notes: Took effect 15 days after publication in the Official Gazette (s.72). The date is derived from the NPC's statement that the 9 September 2017 registration deadline fell exactly one year after the IRR took effect.
  - name: NPC Circular 2022-04 on registration, automated decision-making notification and DPOs
    citation: NPC Circular No. 2022-04
    official_url: https://privacy.gov.ph/wp-content/uploads/2023/05/Circular-2022-04-2.pdf
    status: in-force
    in_force_from: "2023-01-11"
    notes: The NPC announced it took effect on 11 January 2023. It sets who must register data processing systems and DPOs, and how to notify automated decision-making.
  - name: NPC Circular 2023-06 on security of personal data
    citation: NPC Circular No. 2023-06
    official_url: https://privacy.gov.ph/wp-content/uploads/2024/03/NPC-Circular-Repeal-16-01-Signed.pdf
    status: in-force
    in_force_from: "2024-03-30"
    notes: The NPC announced it took effect on 30 March 2024. It repeals NPC Circular 16-01 and applies to the government and the private sector.
regulators:
  - name: National Privacy Commission (NPC)
    url: https://privacy.gov.ph/
obligations:
  scope:
    summary: The DPA covers the processing of all types of personal information by any natural or juridical person, including controllers and processors outside the Philippines that use equipment there or keep an office, branch or agency there (s.4). It also reaches acts abroad involving personal information about Philippine citizens or residents where the entity has a link to the country, such as a contract made there, a local branch or subsidiary, or carrying on business there (s.6). Some information is excluded, such as details of government officers' positions and functions.
    source:
      - https://privacy.gov.ph/data-privacy-act/
      - https://privacy.gov.ph/implementing-rules-regulations-data-privacy-act-2012/
  lawful_bases:
    summary: Process personal information only on one of six criteria, including consent, contract, legal obligation, vital interests, public order or public authority functions, and legitimate interests not overridden by the person's rights (s.12). Legitimate interest needs purpose, necessity and balancing tests (Circular 2023-07). Sensitive personal information is barred unless an exception applies, such as specific prior consent or a law allowing it (s.13). Consent must be freely given, specific and informed, and not bundled with unrelated processing (Circular 2023-04).
    source:
      - https://privacy.gov.ph/data-privacy-act/
      - https://privacy.gov.ph/wp-content/uploads/2024/01/NPC-Circular-No.-2023-07_Guidelines-on-Legitimate-Interest_13-December-2023.pdf
      - https://privacy.gov.ph/wp-content/uploads/2023/11/NPC-Circular-No.-2023-04_Guidelines-on-Consent_07Nov2023.pdf
  consent_age:
    summary: The DPA sets no age for consent. The NPC treats anyone under 18 as a child (Advisory 2024-03), and its consent guidelines let a controller obtain consent from a person's lawful representative or a specifically authorised agent (Circular 2023-04, s.12).
    source:
      - https://privacy.gov.ph/wp-content/uploads/2024/12/Advisory-2024.12.17-Guidelines-on-Child-Oriented-Transparency-w-SGD.pdf
      - https://privacy.gov.ph/wp-content/uploads/2023/11/NPC-Circular-No.-2023-04_Guidelines-on-Consent_07Nov2023.pdf
  children:
    summary: NPC Advisory 2024-03 covers services meant for or likely to be used by children. Use child-friendly, layered privacy notices, choose age assurance by risk, and tell both children and parents of a notifiable breach. On 23 September 2026 the NPC told platforms and game developers to use privacy-preserving age assurance and stop profiling that pushes harmful content to children. Under RA 11930, internet intermediaries must block child sexual abuse material within 24 hours of notice, report to the DOJ within 3 days and preserve data.
    source:
      - https://privacy.gov.ph/wp-content/uploads/2024/12/Advisory-2024.12.17-Guidelines-on-Child-Oriented-Transparency-w-SGD.pdf
      - https://privacy.gov.ph/public-advisory-npc-calls-on-digital-platforms-to-ensure-compliance/
      - https://elibrary.judiciary.gov.ph/thebookshelf/showdocs/2/95572
  cookies:
    summary: There is no cookie-specific law. Cookies and trackers that collect personal information need a lawful basis under the DPA, and consent, if used, must be specific, informed and not bundled (Circular 2023-04). The NPC's advisory on deceptive design patterns (2023-01) says interfaces that confuse privacy controls, keep prompting people to share more, or stop them from refusing are unfair and can make consent invalid.
    source:
      - https://privacy.gov.ph/wp-content/uploads/2023/11/NPC-Circular-No.-2023-04_Guidelines-on-Consent_07Nov2023.pdf
      - https://privacy.gov.ph/wp-content/uploads/2023/11/NPC-Advisory-No.-2023-01-Guidelines-on-Deceptive-Design-Patterns_7Nov23.pdf
      - https://privacy.gov.ph/data-privacy-act/
  marketing:
    summary: People can object to processing for direct marketing, after which it must stop unless an exception applies (IRR s.34). Sharing data with others for commercial purposes, including direct marketing, needs consent and a data sharing agreement (IRR). For SMS and MMS, NTC rules allow promotional broadcasts only with the subscriber's prior consent, given by an act such as texting or signing up, with an opt-out command, the sender's name, and nothing sent from 9 p.m. to 7 a.m. except paid subscriptions.
    source:
      - https://privacy.gov.ph/implementing-rules-regulations-data-privacy-act-2012/
      - https://elibrary.judiciary.gov.ph/thebookshelf/showdocs/10/42711
      - https://elibrary.judiciary.gov.ph/thebookshelf/showdocs/10/49122
  breach_notice:
    summary: Notify the NPC within 72 hours of knowing or reasonably believing that a breach occurred, where sensitive personal information or data that could enable identity fraud was probably acquired by someone unauthorised and creates a real risk of serious harm. Notify affected people within the same 72 hours. A full report is due within 5 days (Circular 16-03; Advisory 2026-02). File through the NPC's online breach system. Report all security incidents yearly; the 2025 reports can be filed until 10 November 2026.
    value: 72
    unit: hours
    source:
      - https://privacy.gov.ph/wp-content/uploads/2022/01/sgd-npc-circular-16-03-personal-data-breach-management.pdf
      - https://privacy.gov.ph/wp-content/uploads/2026/05/Advisory-Clarification-on-the-Submission-of-Personal-Data-Breach-Notification-through-DBNMS_11-May-2026.pdf
      - https://privacy.gov.ph/wp-content/uploads/2026/09/For-Publication-Advisory-Grant-of-Additional-Period-to-Submit-2025-ASIRs_08Sept.pdf
      - https://privacy.gov.ph/data-privacy-act/
  registration_or_fees:
    summary: Controllers and processors with 250 or more employees, processing sensitive information of 1,000 or more people, or doing risky processing must register their data processing systems and DPO with the NPC; systems used for automated decisions or profiling must always be registered (Circular 2022-04). Register within 20 days of a new system or DPO; certificates last a year. Others file a sworn declaration. First registration costs PHP 500 to PHP 2,500 and renewal PHP 350 to PHP 1,000 (Circular 2023-01).
    source:
      - https://privacy.gov.ph/wp-content/uploads/2023/05/Circular-2022-04-2.pdf
      - https://privacy.gov.ph/npc-launches-online-registration-system-for-data-processing-systems/
      - https://privacy.gov.ph/wp-content/uploads/2023/05/Schedule-of-Fees-and-Charges-of-the-National-Privacy-Commission.pdf
  dpo:
    summary: Every controller and processor must designate a data protection officer accountable for compliance (DPA s.21(b); IRR s.26(a); NPC Advisory 2017-01), and tell data subjects who it is on request. Related companies can share a common DPO, and organisations with branches can add compliance officers for privacy who work under the DPO. Registered organisations record their DPO with the NPC (Circular 2022-04).
    source:
      - https://privacy.gov.ph/data-privacy-act/
      - https://privacy.gov.ph/implementing-rules-regulations-data-privacy-act-2012/
      - https://privacy.gov.ph/wp-content/uploads/2022/01/NPC-Advisory-2017-01-sgd.pdf
      - https://privacy.gov.ph/wp-content/uploads/2023/05/Circular-2022-04-2.pdf
  transfers:
    summary: The DPA has no adequacy list or transfer approval. A controller stays responsible for personal information it transfers to a third party, in the Philippines or abroad, and must use contracts or other reasonable means to keep a comparable level of protection (s.21). NPC Advisory 2024-01 points to model clauses for this, such as the ASEAN Model Contractual Clauses and the EU's standard contractual clauses.
    source:
      - https://privacy.gov.ph/data-privacy-act/
      - https://privacy.gov.ph/wp-content/uploads/2024/06/Published-NPC-Advisory-No.-2024-01-Contractual-Clauses-for-Cross-Border-Transfers_30May24.pdf
  dpia:
    summary: Carry out a privacy impact assessment of each processing system that involves personal data, including off-the-shelf software, and update it when processing changes (NPC Circular 2023-06, in force 30 March 2024). It need not be filed but must be shown to the NPC on request. NPC Advisory 2017-03 sets out how to do one.
    source:
      - https://privacy.gov.ph/wp-content/uploads/2024/03/NPC-Circular-Repeal-16-01-Signed.pdf
      - https://privacy.gov.ph/npc-issues-circulars-to-strengthen-personal-data-protection-in-ph/
      - https://privacy.gov.ph/wp-content/uploads/2022/01/NPC_AdvisoryNo.2017-03.pdf
  automated_decisions_ai:
    summary: People can get information about automated processes used as the sole basis for decisions that significantly affect them (DPA s.16(c)(6)), and object to automated processing or profiling (IRR s.34). Systems used for automated decisions or profiling must be registered with the NPC (Circular 2022-04). NPC Advisory 2024-04 (December 2024) applies the DPA to AI systems. Be transparent, allow meaningful human intervention, and let people contest automated decisions that pose a significant risk to them.
    source:
      - https://privacy.gov.ph/data-privacy-act/
      - https://privacy.gov.ph/implementing-rules-regulations-data-privacy-act-2012/
      - https://privacy.gov.ph/wp-content/uploads/2023/05/Circular-2022-04-2.pdf
      - https://privacy.gov.ph/wp-content/uploads/2025/02/Advisory-2024.12.19-Guidelines-on-Artificial-Intelligence-w-SGD.pdf
  penalties:
    summary: Offences carry prison and fines; for example, unauthorised processing means 1 to 3 years and PHP 500,000 to PHP 2,000,000, or 3 to 6 years and up to PHP 4,000,000 for sensitive information. A combination of offences carries up to PHP 5,000,000, and the maximum applies when 100 or more people are affected (ss.25-35). The NPC can also fine 0.5% to 3% of the previous year's annual gross income for grave infractions and 0.25% to 2% for major ones, capped at PHP 5,000,000 per act (Circular 2022-01).
    source:
      - https://privacy.gov.ph/data-privacy-act/
      - https://privacy.gov.ph/wp-content/uploads/2022/08/NPC-CIRCULAR-NO.-2022-01-GUIDELINES-ON-ADMINISTRATIVE-FINES-dated-08-AUGUST-2022-w-SGD.pdf
